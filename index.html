tside of the door."],"say":["They stood outside the door."],"note":"","pg":54,"q":true},{"n":300,"title":"Round (= on all sides of; চারপাশে)","dont":["The earth goes round of the sun."],"say":["The earth goes round the sun."],"note":"Note: Around এবং round-এর অর্থ এবং ব্যবহার একই রকম।","pg":55,"q":true},{"n":303,"title":"Abstract noun-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["The bravery is a great virtue."],"say":["Bravery is a great virtue."],"note":"Abstract noun সাধারণ অর্থে ব্যবহৃত হলে এর পূর্বে the বসে না।\nNote: তবে abstract noun কোনো নির্দিষ্ট অর্থে ব্যবহৃত হলে the প্রয়োজন হয়, যেমন: The bravery of the Spartans was renowned.","pg":55,"q":true},{"n":304,"title":"Material nouns-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["The gold is a precious metal."],"say":["Gold is a precious metal."],"note":"Material nouns যদি সাধারণ ধারণায় ব্যবহৃত হয়, তবে এরা কোন article ব্যতীত ব্যবহৃত হয়। Note: যদি Material nouns কোন নির্দিষ্ট ধারণায় ব্যবহৃত হয়, তবে definite article প্রয়োজন হয়, যেমন: The coal from the Midlands is exported to many countries.","pg":56,"q":true},{"n":305,"title":"সাধারণ ধারণায় plural noun-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["The dogs are faithful animals."],"say":["Dogs are faithful animals."],"note":"Common noun-এর pleural form যদি সাধারণ ধারণায় ব্যবহৃত হয়, তবে এদের পর্বে definite article উহ্য থাকে।","pg":56,"q":true},{"n":306,"title":"ভাষার নামের পূর্বে the-এর অপব্যবহার জনিত ভুল","dont":["Tim speaks the English very well."],"say":["Tim speaks English very well."],"note":"ভাষার নামের পূর্বে definite article ব্যবহৃত হয় না।\nNote: তবে আমরা বলতে পারি: He speaks the English language very well.","pg":56,"q":true},{"n":308,"title":"খেলাধুলার নামের পূর্বে the-এর অপব্যবহার জনিত ভুল:","dont":["My favourite game is the football."],"say":["My favourite game is football."],"note":"Football, hockey, tennis, cricket, volleyball, basketball ইত্যাদি খেলার নামের পূর্বে কোনো article ব্যবহৃত হয় না।","pg":56,"q":true},{"n":310,"title":"রঙের নামের পূর্বে the-এর অপব্যবহার জনিত ভুল:","dont":["The green is a beautiful colour."],"say":["Green is a beautiful colour."],"note":"রঙের নাম যখন noun হিসেবে ব্যবহৃত হয়, তখন এর পূর্বে definite article ব্যবহৃত হওয়া উচিত নয়।","pg":57,"q":true},{"n":311,"title":"পঞ্চ ইন্দ্রিয়ের (senses) নামের পূর্বে the-এর অপব্যবহার জনিত ভুল:","dont":["The sight is one of the five senses."],"say":["Sight is one of the five senses."],"note":"পঞ্চ ইন্দ্রিয়ের নাম — sight, smell, hearing, taste এবং touch — এদের পূর্বে article ব্যবহৃত হয় না।","pg":57,"q":true},{"n":312,"title":"দিন এবং মাসের নামের পূর্বে the-এর অপব্যবহার জনিত ভুল:","dont":["The Sunday can be a day of prayer.","The December is the last month."],"say":["Sunday can be a day of prayer.","December is the last month."],"note":"দিন এবং মাসের নামের পূর্বে definite article ব্যবহৃত হওয়া উচিত নয়।\nNote: তবে আমরা বলি: the Sunday before last, the December of 1940 ইত্যাদি।","pg":57,"q":true},{"n":313,"title":"মানব জাতি নির্দেশক man-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["The man is born a sinner."],"say":["Man is born a sinner."],"note":"মানব জাতি (human race) বোঝাতে man-এর পূর্বে definite article ব্যবহৃত হয় না। একইভাবে mankind-এর পূর্বেও article লাগে না, যেমন: Disease is the enemy of mankind.","pg":57,"q":true},{"n":314,"title":"School-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["My sister goes to the school."],"say":["My sister goes to school."],"note":"To go to school মানে হল ছাত্র হিসেবে স্কুলে যাওয়া (পড়াশোনার জন্য), পক্ষান্তরে to go to the school মানে হল অন্য কোনো কাজে স্কুল ভবনে যাওয়া।\nNote: একইভাবে to leave school মানে ছাত্রজীবনের পরিসমাপ্তি ঘটানো এবং to leave the school মানে স্কুল ভবন থেকে বের হওয়া।","pg":57,"q":true},{"n":315,"title":"Nature-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["The nature is beautiful in spring."],"say":["Nature is beautiful in spring."],"note":"Note: The সহ ‘nature’ ভিন্ন অর্থে (স্বভাব) ব্যবহৃত হয়, যেমন: It is in the nature of a dog to be faithful.","pg":57,"q":true},{"n":316,"title":"Church-এর সাথে the-এর অপব্যবহার জনিত ভুল:","dont":["On Sunday I go to the church."],"say":["On Sunday I go to church."],"note":"To go to church মানে প্রার্থনা করতে যাওয়া, আর to go to the church মানে গির্জা ভবনটি পরিদর্শন করতে যাওয়া।\nNote: একই রকম পার্থক্য রয়েছে go to bed ও go to the bed, go to prison ও go to the prison, go to market ও go to the market, go to hospital ও go to the hospital, sit at table ও sit at the table-এর মধ্যে।","pg":58,"q":true},{"n":319,"title":"Whose-এর পরে the-এর অপব্যবহার জনিত ভুল:","dont":["The boy whose the father is ill has left."],"say":["The boy whose father is ill has left."],"note":"Relative pronoun whose-এর পরে article ব্যবহার করবেন না, কারণ whose নিজেই the-এর স্থান নেয়।","pg":58,"q":true},{"n":320,"title":"Work ইত্যাদির পূর্বে indefinite article-এর অপব্যবহার জনিত ভুল:","dont":["Gillian has found a work at the bank."],"say":["Gillian has found work at the bank."],"note":"Work, fun, health, permission-এর মতো কিছু uncountable শব্দের পূর্বে indefinite article (a / an) ব্যবহার করবেন না।","pg":58,"q":true},{"n":321,"title":"Can + infinitive (to ব্যতীত)","dont":["My mother can to swim very well."],"say":["My mother can swim very well."],"note":"Note: Negative form-টি এক শব্দে লেখা হয়: cannot (can't)।","pg":59,"q":true},{"n":322,"title":"Could + infinitive (to ব্যতীত)","dont":["I could not to see you yesterday."],"say":["I could not / couldn't see you yesterday."],"note":"","pg":59,"q":true},{"n":323,"title":"May + infinitive (to ব্যতীত)","dont":["May to visit you next weekend?"],"say":["May I visit you next weekend?"],"note":"","pg":59,"q":true},{"n":324,"title":"Might + infinitive (to ব্যতীত)","dont":["He might to come in the morning."],"say":["He might come in the morning."],"note":"","pg":59,"q":true},{"n":325,"title":"Must + infinitive (to ব্যতীত)","dont":["I must to see her at her office."],"say":["I must see her at her office."],"note":"","pg":59,"q":true},{"n":326,"title":"Let + infinitive (to ব্যতীত)","dont":["Tom's father would not let him to go out."],"say":["Tom's father would not let him go out."],"note":"","pg":59,"q":true},{"n":327,"title":"Make (to force- বাধ্য করা) + infinitive (to ব্যতীত)","dont":["You can’t make Emma to understand."],"say":["You can't make Emma understand."],"note":"","pg":59,"q":true},{"n":328,"title":"See + infinitive (to ব্যতীত)","dont":["They saw him to leave the house."],"say":["They saw him leave the house."],"note":"Note: They saw him leaving the house — এটিও সঠিক।","pg":59,"q":true},{"n":329,"title":"Watch + infinitive (to ব্যতীত)","dont":["I watched the girls to play hockey."],"say":["I watched the girls play hockey."],"note":"Note: I watched the girls playing hockey — এটিও সঠিক।","pg":59,"q":true},{"n":330,"title":"Hear + infinitive (to ব্যতীত)","dont":["We heard him to speak in English."],"say":["We heard him speak in English."],"note":"Note: We heard him speaking in English — এটিও সঠিক।","pg":61,"q":true},{"n":331,"title":"Feel + infinitive (to ব্যতীত)","dont":["I could feel her heart to beat."],"say":["I could feel her heart beat."],"note":"Or: I could feel her heart beating.\nNote: Make, see, watch, hear, feel — এই verb-গুলো passive voice-এ ব্যবহৃত হলে to অবশ্যই ব্যবহৃত হবে, যেমন: He was seen to leave the house; He was heard to speak in English.","pg":61,"q":true},{"n":332,"title":"Subject-এর repetition (পুনরাবৃত্তি) জনিত ভুল:","dont":["My little brother he is at school."],"say":["My little brother is at school."],"note":"Noun-এর পরে একটি pronoun ব্যবহার করে subject-এর পুনরাবৃত্তি করবেন না। My little brother এবং he একই ব্যক্তিকে নির্দেশ করছে, সুতরাং এদের যে কোনো একটি subject হিসেবে ব্যবহৃত হতে পারে, উভয়টি নয়।","pg":61,"q":true},{"n":333,"title":"Compound sentence (যৌগিক বাক্য)-এ subject-এর repetition (পুনরাবৃত্তি) জনিত ভুল:","dont":["I went to the market and I bought fruit."],"say":["I went to the market and bought fruit."],"note":"যৌগিক বাক্যে একই subject কেবল একবার প্রকাশিত হয় এবং প্রত্যেক verb-এর পূর্বে পুনরাবৃত্তি হয় না, যদি না বাক্যটি দীর্ঘ এবং জটিল হয়।","pg":61,"q":true},{"n":334,"title":"Adjective clause-এর পরে subject-এর repetition (পুনরাবৃত্তি) জনিত ভুল:","dont":["David, who is a careless pupil, he lost his book."],"say":["David, who is a careless pupil, lost his book."],"note":"Subordinate clause-টি যদি subject-কে বর্ণনা করে, তবে principal clause-এর verb-এর পূর্বে subject-কে personal pronoun দিয়ে আবার প্রকাশ করা উচিত নয়।","pg":61,"q":true},{"n":336,"title":"Relative clause-এ personal pronoun-এর repetition (পুনরাবৃত্তি) জনিত ভুল:","dont":["The book which I lost it was new."],"say":["The book which I lost was new."],"note":"একই antecedent-কে নির্দেশ করলে একটি personal pronoun এবং একটি relative pronoun একত্রে কোনো relative clause-এ ব্যবহৃত হতে পারে না। প্রথম বাক্যে which এবং it উভয়ই book noun-কে নির্দেশ করছে।","pg":62,"q":true},{"n":338,"title":"Infinitive-এর সাথে object-এর repetition (পুনরাবৃত্তি) জনিত ভুল:","dont":["I bought an English book to read it."],"say":["I bought an English book to read."],"note":"যদি verb-টি একটি object গ্রহণ করে থাকে, তবে উদ্দেশ্য প্রকাশক infinitive-এর সাথে object-এর পুনরাবৃত্তি হতে পারে না।","pg":62,"q":true},{"n":339,"title":"Direct speech-এ that ব্যবহার জনিত ভুল:","dont":["She said that, ‘I’m sure to pass.’"],"say":["She said, ‘I’m sure to pass.’"],"note":"অন্যের বলা কথা কোনো পরিবর্তন ছাড়াই হুবহু উদ্ধৃত করলে (direct speech) আমরা that ব্যবহার করতে পারি না।\nNote: Indirect speech-এ আমরা বলি: She said that she was sure to pass.","pg":62,"q":true},{"n":340,"title":"Double comparative ব্যবহার জনিত ভুল:","dont":["He's more stronger than John."],"say":["He's stronger than John."],"note":"Double comparative ব্যবহার করা ভুল: more stronger নয়, কেবল stronger। অবশ্য আমরা much stronger বলতে পারি।","pg":62,"q":true},{"n":341,"title":"যে adjective-গুলো তুলনা করা যায় না, সেগুলোর অপব্যবহার জনিত ভুল:","dont":["My work is more perfect than his."],"say":["My work is superior to his."],"note":"Perfect, unique, preferable, supreme, right, correct ইত্যাদি কিছু adjective-এর তুলনা (comparison) হয় না।","pg":62,"q":true},{"n":342,"title":"Return-এর পরিবর্তে return back ব্যবহার জনিত ভুল:","dont":["She has returned back to school."],"say":["She has returned to school."],"note":"Return-এর সাথে back word-টি ব্যবহৃত হতে পারে না, কারণ return অর্থই হচ্ছে ফিরে আসা (to come back)।","pg":63,"q":true},{"n":343,"title":"Begin-এর পরিবর্তে begin from ব্যবহার জনিত ভুল:","dont":["Exams begin from Thursday."],"say":["Exams begin on Thursday."],"note":"কোনো কাজ সময়ের একটি নির্দিষ্ট মুহূর্তেই শুরু হয়। তাই begin-এর পরে from-এর মতো এমন শব্দ ব্যবহার করা যায় না যা পুরো সময়কালকে নির্দেশ করে।","pg":63,"q":true},{"n":345,"title":"To-এর পরিবর্তে for to ব্যবহার জনিত ভুল:","dont":["I came here for to learn English."],"say":["I came here to learn English."],"note":"Infinitive-এর চিহ্ন to-এর পূর্বে কখনও preposition for বসানো উচিত নয়।","pg":63,"q":true},{"n":348,"title":"So... that-এর পরিবর্তে so... so that ব্যবহার জনিত ভুল:","dont":["I'm so tired so that I can't go."],"say":["I'm so tired that I can't go."],"note":"ফলাফল প্রকাশক clause যখন so বা such-কে অনুসরণ করে, তখন clause-টি that দিয়ে শুরু হয়, so that দিয়ে নয়।","pg":64,"q":true},{"n":349,"title":"From now on-এর পরিবর্তে from now and on ব্যবহার জনিত ভুল:","dont":["From now and on I’ll study hard."],"say":["From now on I’ll study hard."],"note":"Note: From now and on অশুদ্ধ; বলুন from now on।","pg":64,"q":true},{"n":350,"title":"Although / though-এর পরিবর্তে although / though... yet ব্যবহার জনিত ভুল:","dont":["Although it’s raining, yet he'll go."],"say":["Although it's raining, he'll go."],"note":"Although (though) conjunction যখন subordinate clause শুরু করে, তখন principal clause-এ yet বা still-এর প্রয়োজন পড়ে না।","pg":64,"q":true},{"n":351,"title":"Go home-এর পরিবর্তে go to home-এর ব্যবহার জনিত ভুল:","dont":["When school is over I go to home."],"say":["When school is over I go home."],"note":"Go to home অভিব্যক্তিটি ভুল; সঠিক হবে go home।","pg":64,"q":true},{"n":352,"title":"নির্দিষ্ট দূরত্ব প্রকাশক phrase-এর সাথে far ব্যবহার জনিত ভুল:","dont":["Mary lives two miles far from here."],"say":["Mary lives two miles from here."],"note":"বাক্যে নির্দিষ্ট দূরত্ব প্রকাশক phrase থাকলে far word-টি ব্যবহৃত হতে পারে না; তবে আমরা বলতে পারি: Mary lives two miles away.","pg":64,"q":true},{"n":353,"title":"নির্দিষ্ট সময় প্রকাশক adverb-এর ভুল প্রয়োগ / অবস্থান:","dont":["I last night went to the cinema."],"say":["I went to the cinema last night."],"note":"নির্দিষ্ট সময় প্রকাশক adverb বা adverb phrase (যেমন: yesterday, today, tomorrow, last week, two months ago) সাধারণত বাক্যের শেষে বসে। তবে সময়ের উপর জোর দিতে চাইলে এদের বাক্যের শুরুতেও বসানো যায়, যেমন: Last night I went to the cinema.\nNote: একই বাক্যে সময় প্রকাশক একাধিক adverb বা phrase থাকলে অপেক্ষাকৃত সুনির্দিষ্টটিকে অপেক্ষাকৃত সাধারণটির পূর্বে বসাই, যেমন: He was born at two o'clock in the morning on April 12, 1942.","pg":65,"q":true},{"n":354,"title":"অনির্দিষ্ট সময় প্রকাশক adverb-এর অশুদ্ধ প্রয়োগ / অবস্থান:","dont":["They come always to school by bus."],"say":["They always come to school by bus."],"note":"অনির্দিষ্ট সময় প্রকাশক adverb, যেমন: ever, never, always, often, seldom, soon, sometimes এবং almost, scarcely, hardly, nearly, even — এগুলো principal verb-এর পূর্বে বসে।\nNote: Principal verb যখন to be, তখন এই adverb-গুলো verb-এর পরে বসে, যেমন: They are always beautifully dressed.","pg":65,"q":true},{"n":357,"title":"Enough adverb-এর অশুদ্ধ (misplaced) প্রয়োগ / অবস্থান","dont":["Is the room enough large for you?"],"say":["Is the room large enough for you?"],"note":"Adverb enough যে word-কে বিশেষিত করে তার পরে বসে, পূর্বে নয়।\nNote: লক্ষণীয়, enough যখন noun-এর সাথে বসে তখন তা noun-এর পূর্বে (বা পরে) বসতে পারে, যেমন: We have enough food for six people.","pg":66,"q":true},{"n":358,"title":"Compound verb-এর সাথে not-এর ভুল (misplaced) অবস্থান:","dont":["I should have not gone."],"say":["I should not have gone."],"note":"Compound verb-এ not প্রথম auxiliary-এর পরে বসে।\nNote: লক্ষণীয়, present ও perfect participle-এর সাথে not শুরুতে বসে, যেমন: Not having set the alarm, he was late for work; Not being rich, he couldn't afford it.","pg":66,"q":true},{"n":359,"title":"Negative infinitive-এর সাথে not-এর ভুল অবস্থান:","dont":["Tell Liz to not come on Monday."],"say":["Tell Liz not to come on Monday."],"note":"Negative infinitive-এ not-এর অবস্থান হল to-এর ঠিক পূর্বে, পরে নয়।","pg":66,"q":true},{"n":360,"title":"বাক্যে subject-এর ভুল (misplaced) অবস্থান:","dont":["Last week visited our school a man."],"say":["A man visited our school last week."],"note":"অধিকাংশ ইংরেজি বাক্যে প্রথমে subject, তারপর verb, তারপর object এবং পরবর্তীতে অবশিষ্টাংশ বসে।","pg":66,"q":true},{"n":363,"title":"Never ইত্যাদির পরে subject-এর ভুল অবস্থান:","dont":["Never I have heard of such a thing."],"say":["Never have I heard of such a thing."],"note":"Never, seldom, rarely, neither, nor, not only, no sooner যখন একটি clause-এর শুরুতে বসে, তখন প্রশ্নবোধক বাক্যের মতো auxiliary verb subject-এর পূর্বে বসে।","pg":67,"q":true},{"n":364,"title":"Not all-এর পরিবর্তে all ... not ব্যবহার জনিত ভুল:","dont":["All people are not hard-working."],"say":["Not all people are hard-working."],"note":"প্রথম বাক্যটি ‘কোনো লোকই পরিশ্রমী নয়’ (all people are lazy) এমন অর্থ প্রকাশ করতে পারে, যা অযৌক্তিক।\nNote: একইভাবে Everybody doesn't like dancing হওয়া উচিত: Not everybody likes dancing.","pg":67,"q":true},{"n":367,"title":"Qualifying adjective-এর ভুল (misplaced) অবস্থান:","dont":["My uncle has a garden very large."],"say":["My uncle has a very large garden."],"note":"Qualifying adjective যে noun-কে বিশেষিত করে, সাধারণত তার ঠিক পূর্বেই বসে।","pg":67,"q":true},{"n":368,"title":"Indirect object-এর ভুল (misplaced) অবস্থান:","dont":["I showed to her some of my stamps."],"say":["I showed some of my stamps to her."],"note":"Indirect object-এর পূর্বে preposition থাকলে তা direct object-এর পরে বসে।\nNote: তবে indirect object preposition ছাড়া থাকলে সাধারণত প্রথমে বসে, যেমন: I showed her some of my stamps.","pg":68,"q":true},{"n":369,"title":"Past participle-এর ভুল (misplaced) প্রয়োগ / অবস্থান:","dont":["The ordered goods haven't arrived."],"say":["The goods ordered haven't arrived."],"note":"‘The goods ordered’ হল ‘The goods which have been ordered’-এর সংক্ষিপ্ত রূপ।\nসতর্কতা: আধুনিক ইংরেজিতে “The ordered goods haven't arrived.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":69,"q":false},{"n":370,"title":"Relative clause-এর ভুল (misplaced) প্রয়োগ / অবস্থান:","dont":["A girl has a pony who is in our class."],"say":["A girl who is in our class has a pony."],"note":"Relative clause যে noun-কে নির্দেশ করে, তার ঠিক পরেই বসে।\nNote: যে relative clause বাদ দিলেও মূল অর্থ বোঝা যায়, তা কমা দ্বারা আলাদা করা হয়, যেমন: My brother George, who is in another class, has a new bicycle. যে relative clause বাদ দেওয়া যায় না, তা কমা দ্বারা আলাদা হয় না, যেমন: The boy who spoke to me is my brother.","pg":69,"q":true},{"n":371,"title":"সময় প্রকাশক clause-এর conjunction-এর ভুল (misplaced) প্রয়োগ / অবস্থান:","dont":["Emma when she arrived the boat had already gone."],"say":["When Emma arrived, the boat had already gone."],"note":"Conjunction যখন সময় প্রকাশক কোনো adverbial clause শুরু করে, তখন তা অবশ্যই clause-এর শুরুতে বসে।","pg":69,"q":true},{"n":372,"title":"Correlative conjunction-এর ভুল অবস্থান:","dont":["Paul neither speaks English nor French."],"say":["Paul speaks neither English nor French."],"note":"Correlative conjunction (যে conjunction জোড়ায় ব্যবহৃত হয়, যেমন: neither ... nor, not only ... but also ইত্যাদি) একই ধরনের part of speech-এর পূর্বে বসা উচিত।","pg":69,"q":true},{"n":373,"title":"Ordinal number-এর ভুল (misplaced) অবস্থান:","dont":["I've read the two first chapters."],"say":["I've read the first two chapters."],"note":"Ordinal number (ক্রমবাচক সংখ্যা: first, second ...) cardinal number (two, three ...)-এর পূর্বে বসা উচিত। দুটি ‘প্রথম’ (two first) হতে পারে না, প্রথম কেবল একটিই হয়। একইভাবে বলুন the last two (three, etc.), the two (three, etc.) last নয়।","pg":69,"q":true},{"n":374,"title":"Such বা so-এর সাথে indefinite article-এর ভুল (misplaced) অবস্থান:","dont":["I never met a such good man before."],"say":["I never met such a good man before."],"note":"Indefinite article a বা an, such-এর পরে বসা উচিত, যেমন: such a good man; so-এর ক্ষেত্রে: so good a man।","pg":69,"q":true},{"n":375,"title":"Half-এর সাথে definite article-এর ভুল (misplaced) অবস্থান:","dont":["The half year is nearly finished."],"say":["Half the year is nearly finished."],"note":"‘Half the year’ হল ‘half of the year’-এর সংক্ষিপ্ত রূপ।","pg":70,"q":true},{"n":376,"title":"Most of-এর পরিবর্তে the most of ব্যবহার জনিত ভুল:","dont":["The most of the girls are not present."],"say":["Most of the girls are not present."],"note":"Note: The most of অশুদ্ধ; বলুন most of the girls।","pg":70,"q":true},{"n":378,"title":"প্রথমে নিজেকে উল্লেখ করা জনিত ভুল (Mentioning oneself first):","dont":["Only I and my mother are present."],"say":["Only my mother and I are present."],"note":"ইংরেজি রীতিতে কেউ যখন একই সাথে নিজের এবং অন্যদের কথা বলে, তখন অন্যদের আগে এবং নিজেকে পরে উল্লেখ করতে হয়।\nNote: তবে দোষ স্বীকার করার সময় প্রথমে নিজেকে উল্লেখ করা যায়, যেমন: I and my brother broke the window.","pg":70,"q":true},{"n":379,"title":"To এবং At.","dont":["We come at school every morning.","Someone is standing to the door."],"say":["We come to school every morning.","Someone is standing at the door."],"note":"এক স্থান থেকে অন্য স্থানে গতি বোঝাতে to ব্যবহৃত হয়; পক্ষান্তরে অবস্থান বা স্থিতি বোঝাতে at ব্যবহৃত হয়।","pg":72,"q":true},{"n":380,"title":"To এবং Till","dont":["We walked till the river and back.","I'll stay here to next month."],"say":["We walked to the river and back.","I'll stay here till next month."],"note":"দূরত্ব বোঝাতে to এবং সময় বোঝাতে till (until) ব্যবহৃত হয়।","pg":72,"q":true},{"n":381,"title":"In এবং At","dont":["Liam has a flat at Paris.","My mother is staying in 66 Argyle Street."],"say":["Liam has a flat in Paris.","My mother is staying at 66 Argyle Street."],"note":"In সাধারণত দেশ ও বড় শহরের নামের পূর্বে বসে। At ছোট শহর ও গ্রামের নামের পূর্বে বসে। এছাড়া নম্বরসহ ঠিকানা, public place (a bus stop, the Post Office, the library ইত্যাদি) এবং যেসব জায়গায় কী হয় তা আমরা জানি (school, the dentist, dance class ইত্যাদি) বোঝাতে at ব্যবহার করি।","pg":72,"q":true},{"n":382,"title":"In এবং Into","dont":["Gemma spent all the day into her room.","Richard came in the room and sat down."],"say":["Gemma spent all the day in her room.","Richard came into the room and sat down."],"note":"কোনো কিছুর ভেতরে অবস্থান বা স্থিতি বোঝাতে in ব্যবহৃত হয়; আর বাইরে থেকে ভেতরের দিকে গতি বোঝাতে into ব্যবহৃত হয়।\nNote: Into preposition-টি সর্বদা একটি word হিসেবে লেখা হয়।","pg":73,"q":true},{"n":383,"title":"On, At, In (সময় প্রকাশ করতে)","dont":["My uncle will arrive at Saturday.","I usually get up on seven o'clock."],"say":["My uncle will arrive on Saturday.","I usually get up at seven o'clock."],"note":"1) সপ্তাহের দিন বা তারিখের সাথে on ব্যবহৃত হয়, যেমন: on Friday, on March 25, on New Year's Day।\n2) সুনির্দিষ্ট সময়ের সাথে at ব্যবহৃত হয়, যেমন: at four o'clock, at dawn, at noon, at sunset, at midnight।\n3) দীর্ঘ সময়কালের সাথে in ব্যবহৃত হয়, যেমন: in April, in winter, in 1945, in the morning; তবে at night এবং by day হয়।","pg":73,"q":true},{"n":384,"title":"For এবং At (মূল্য প্রকাশ করতে)","dont":["I bought a book at fifty pence.","I can’t buy it for such a high price."],"say":["I bought a book for fifty pence.","I can’t buy it at such a high price."],"note":"Note: প্রকৃত (নির্দিষ্ট) মূল্য উল্লেখ থাকলে for ব্যবহৃত হয়; প্রকৃত মূল্য উল্লেখ না থাকলে at বসে। তবে প্রকৃত মূল্যের পরে ওজন বা পরিমাপ থাকলে at ব্যবহৃত হতে পারে, যেমন: That velvet is available at £5 a metre.","pg":73,"q":true},{"n":385,"title":"Between এবং Among","dont":["There was a fight among two boys.","Divide the apple between you three."],"say":["There was a fight between two boys.","Divide the apple among you three."],"note":"কেবল দু’জন বা দুটি বস্তুর মধ্যে বোঝালে between ব্যবহৃত হয়; পক্ষান্তরে দু’য়ের অধিক বোঝালে among ব্যবহৃত হয়।","pg":74,"q":true},{"n":386,"title":"Beside এবং Besides","dont":["Charlie was standing just besides me.","We study French beside English."],"say":["Charlie was standing just beside me.","We study French besides English."],"note":"Beside অর্থ হল পাশে (by the side of) এবং besides অর্থ হল অধিকন্তু / এছাড়াও (in addition to)।","pg":74,"q":true},{"n":388,"title":"With-এর পরিবর্তে by ব্যবহার জনিত ভুল:","dont":["The man shot the bird by a gun."],"say":["The man shot the bird with a gun."],"note":"যে উপকরণ বা যন্ত্রের সাহায্যে আমরা কোনো কাজ করি, তা বোঝাতে with ব্যবহার করি। কাজটি যে করে তাকে বোঝাতে by ব্যবহৃত হয়, যেমন: The bird was shot by the man.\nNote: তবে নিচের ক্ষেত্রগুলোতে by বসে, with নয়: by (electric) light, by steam, by hand, by post, by telephone, by one’s watch, by the day, by the dozen, by the yard.","pg":74,"q":true},{"n":391,"title":"About-এর পরিবর্তে for ব্যবহার জনিত ভুল:","dont":["The teacher spoke for bad habits."],"say":["The teacher spoke about bad habits."],"note":"‘সম্বন্ধে’ (about) অর্থে for ব্যবহৃত হতে পারে না। For প্রধানত ‘কোনো কিছুর পক্ষে’ বা ‘কোনো কিছুর উদ্দেশ্যে’ অর্থ নির্দেশ করে। সুতরাং The teacher spoke for bad habits বললে বোঝায় যে তিনি মন্দ অভ্যাসগুলোর পক্ষে বলেছিলেন!","pg":75,"q":true},{"n":392,"title":"For-এর পরিবর্তে since ব্যবহার জনিত ভুল:","dont":["She's lived here since two years."],"say":["She’s lived here for two years."],"note":"সময়ের ব্যাপ্তিকাল নির্দেশক word বা phrase-এর পূর্বে for বসে, যেমন: for three days, for six weeks, for two years, for a few minutes, for a long time। এটি simple present ব্যতীত যে কোনো tense-এর সাথে ব্যবহৃত হতে পারে।\nNote: For প্রায়ই উহ্য থাকে: I've been here for two years বা I've been here two years.","pg":75,"q":true},{"n":393,"title":"Since-এর পরিবর্তে from ব্যবহার জনিত ভুল:","dont":["Ian's been ill from last Friday."],"say":["Ian’s been ill since last Friday."],"note":"কোনো নির্দিষ্ট সময়-বিন্দু থেকে শুরু বোঝাতে word বা phrase-এর পূর্বে since বসে, যেমন: since Monday, since yesterday, since eight o'clock, since Christmas। Since ব্যবহৃত হলে verb সাধারণত present perfect tense-এ হয়; তবে past perfect-এও হতে পারে, যেমন: I was glad to see Tom. I hadn't seen him since last Christmas.\nNote: From-ও সময়ের শুরুর বিন্দু নির্দেশ করতে পারে, তবে এর পরে অবশ্যই to বা till বসবে, যেমন: He works from eight o'clock till one o'clock without a break.","pg":75,"q":true},{"n":394,"title":"In-এর পরিবর্তে after ব্যবহার জনিত ভুল:","dont":["I may be able to go after a week."],"say":["I may be able to go in a week."],"note":"Or: I may be able to go in a week's time.\nভবিষ্যতের কোনো সময়-ব্যবধানের কথা বললে আমরা অবশ্যই in ব্যবহার করব, after নয়। এখানে in অর্থ হল ‘নির্দিষ্ট সময় শেষ হলে’ (at the end of)।","pg":76,"q":true},{"n":395,"title":"Within-এর পরিবর্তে in ব্যবহার জনিত ভুল:","dont":["Come back in an hour."],"say":["Come back within an hour."],"note":"In অর্থ হল নির্দিষ্ট সময় শেষ হলে (after the end of) এবং within অর্থ হল নির্দিষ্ট সময় শেষ হওয়ার আগেই (before the end of)।\nসতর্কতা: “Come back in an hour.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":76,"q":false},{"n":396,"title":"Shall এবং Will.","dont":["I will go tomorrow if it’s fine.","She tells me you shall go tomorrow."],"say":["I shall go tomorrow if it’s fine.","She tells me you will go tomorrow."],"note":"a) সাধারণ ভবিষ্যৎ প্রকাশ করতে প্রথাগত নিয়মে first person-এর সাথে shall এবং second ও third person-এর সাথে will ব্যবহার করা হয়।\nb) দৃঢ়তা বা ব্যক্তিগত সংকল্প বোঝাতে first person-এর সাথে will, এবং আদেশ বা প্রতিজ্ঞা বোঝাতে second ও third person-এর সাথে shall ব্যবহৃত হয়।\nNote: Should হল shall-এর past tense এবং would হল will-এর past tense; এদের মধ্যেও একই পার্থক্য বিদ্যমান, যেমন: I was afraid that I should fail; I promised that I would help him.\nসতর্কতা: আধুনিক ইংরেজিতে first person-এর সাথেও will ব্যাপকভাবে ব্যবহৃত ও গ্রহণযোগ্য।","pg":77,"q":false},{"n":398,"title":"Say এবং Tell","dont":["He told, ‘I’ll go home.’","He told that he’d go home.","He said me that he would go home."],"say":["He said, ‘I’ll go home.’","He said that he’d go home.","He told me that he would go home."],"note":"To say ব্যবহৃত হয় 1) কারো হুবহু বক্তব্য উদ্ধৃত করতে, এবং 2) indirect speech-এ, যখন বাক্যে কোনো indirect object থাকে না। To tell ব্যবহৃত হয় indirect speech-এ, যখন বাক্যে একটি indirect object থাকে। শেষ বাক্যে indirect object হচ্ছে me।\nNote: Say এবং tell সমেত প্রচলিত idiom-গুলো:\na) to say one’s prayers, to say grace, to say ‘Good morning’, to say something or nothing, to say no more, to say a good word for, to say so.\nb) to tell the truth, to tell a lie, to tell a story, to tell the time, to tell a secret, to tell the price, to tell one’s fortune, to tell one’s name.","pg":78,"q":true},{"n":399,"title":"Make এবং Do","dont":["The carpenter did a large table.","You must make your work carefully."],"say":["The carpenter made a large table.","You must do your work carefully."],"note":"To make প্রধানত (কোনো কিছু) নির্মাণ বা তৈরি করা অর্থ নির্দেশ করে; পক্ষান্তরে to do অর্থ হল কোনো কাজ করা বা সম্পন্ন করা।\nNote: Make এবং do সমেত প্রচলিত idiom-গুলো:\na) to make a mistake, to make a promise, to make a speech, to make an excuse, to make haste, to make fun of, to make a bed (= ঘুমানোর জন্য বিছানা গোছানো)।\nb) to do good, to do evil, to do one’s best, to do someone a favour, to do wrong, to do a lesson, to do a problem, to do business, to do away with, to do gymnastics, to do exercises.","pg":78,"q":true},{"n":400,"title":"Lie এবং Lay.","dont":["I'm going to lay down for an hour.","Please lie the exam papers on the desk."],"say":["I'm going to lie down for an hour.","Please lay out the exam papers on the desk."],"note":"Lie (বিশ্রাম করা / শোয়া) হল intransitive verb এবং এটি কোনো object গ্রহণ করে না। Lay (রাখা / শোয়ানো) হল transitive verb এবং সর্বদা একটি object গ্রহণ করে। এদের প্রধান রূপগুলো হল যথাক্রমে lie, lay, lain এবং lay, laid, laid।\nNote: Lie (lied, lied) অর্থ মিথ্যা বলা, যেমন: He has lied to me. Lay (laid, laid) অর্থ ডিম পাড়াও হয়, যেমন: The hen has laid an egg. Lay the table বা lay the cloth অর্থ খাবারের জন্য টেবিল সাজানো।","pg":79,"q":true},{"n":401,"title":"Sit এবং Seat","dont":["Please seat down.","He sat himself near the fire."],"say":["Please sit down.","He seated himself near the fire."],"note":"Sit প্রধানত intransitive verb হিসেবে ব্যবহৃত হয়; seat হল transitive verb এবং এর একটি object প্রয়োজন হয়, যা বেশির ভাগ ক্ষেত্রে একটি reflexive pronoun, যেমন: He seated himself near the fire. এদের প্রধান রূপগুলো হল যথাক্রমে sit, sat, sat এবং seat, seated, seated।\nNote-1: Set-এর সাথে sit গুলিয়ে ফেলবেন না। Set (transitive) অর্থ কোনো জিনিস স্থাপন করা বা রাখা, যেমন: Set the lamp on the table. Intransitive হিসেবে set অর্থ (সূর্য বা তারা) অস্ত যাওয়া, যেমন: The sun has set.\nNote-2: Set সমেত প্রচলিত idiom: to set the table, to set on fire, to set off (out), to set in order, to set a trap, to set a clock, to set a price, to set your heart on, to set free, to set an example, to set a broken bone, to set to work (= কাজ শুরু করা)।","pg":79,"q":true},{"n":402,"title":"Rise এবং Raise","dont":["Val raises very early in the morning.","She rose their salaries too often."],"say":["Val rises very early in the morning.","She raised their salaries too often."],"note":"Rise একটি intransitive verb, যার অর্থ উপরে ওঠা, দাঁড়ানো বা ঘুম থেকে ওঠা (to go up, stand up, or get out of bed); এর কোনো object প্রয়োজন হয় না। Raise হল transitive verb এবং অর্থ হল কোনো কিছু উঠানো বা বাড়ানো (to lift up something)। এদের প্রধান রূপগুলো হল যথাক্রমে rise, rose, risen এবং raise, raised, raised।\nNote: Rise-এর পরিবর্তে arise-ও ব্যবহৃত হয়, তবে arise কেবল ‘উদ্ভূত হওয়া / শুরু হওয়া’ অর্থে ব্যবহার করাই ভালো, যেমন: A quarrel (a discussion, an argument, a difficulty, etc.) may arise.","pg":80,"q":true},{"n":404,"title":"Hanged এবং Hung","dont":["No-one has been hung in Britain since 1964.","We hanged the picture on the wall."],"say":["No-one has been hanged in Britain since 1964.","We hung the picture on the wall."],"note":"কোনো ব্যক্তিকে ফাঁসিতে ঝুলিয়ে মারা অর্থ বোঝালে hanged ব্যবহার করি; অন্যান্য ক্ষেত্রে রূপটি হয় hung। এদের প্রধান রূপগুলো হল যথাক্রমে hang, hanged, hanged এবং hang, hung, hung।","pg":80,"q":true},{"n":405,"title":"Stay এবং Remain","dont":["We remained in a very good hotel.","Not many figs have stayed on the tree."],"say":["We stayed in a very good hotel.","Not many figs have remained on the tree."],"note":"এখানে to stay অর্থ হল (অতিথি বা দর্শনার্থী হিসেবে স্বল্প) সময়ের জন্য কোথাও থাকা; আর to remain অর্থ হল (কিছু নেওয়া বা নষ্ট হওয়ার পরে) অবশিষ্ট থাকা।\nNote: একই জায়গায় বা অবস্থায় থেকে যাওয়া অর্থে দুটি verb-এর যে কোনোটিই ব্যবহৃত হতে পারে, যেমন: I shall stay (or remain) at home till tomorrow.\nসতর্কতা: “We remained in a very good hotel.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":81,"q":false},{"n":406,"title":"Wear এবং Put on.","dont":["Kathy always puts on black shoes.","I wear my clothes in the morning."],"say":["Kathy always wears black shoes.","I put on my clothes in the morning."],"note":"Wear অর্থ হল (পোশাক বা অলংকার) পরে থাকা — একটি অবস্থা। To put on (কাপড় পরা) একটি একক কাজকে নির্দেশ করে।\nNote: To dress-এর অর্থ to put on-এর মতোই, তবে dress-এর object হল ব্যক্তি, কোনো জিনিস নয়, যেমন: He dressed himself and went out; The mother dressed her baby.\nসতর্কতা: “Kathy always puts on black shoes.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":81,"q":false},{"n":407,"title":"Tear এবং Tear up.","dont":["John tore up his coat on a nail.","Philip was angry and tore the letter."],"say":["John tore his coat on a nail.","Philip was angry and tore up the letter."],"note":"To tear অর্থ হল (কখনও কখনও দুর্ঘটনাবশত) ছিঁড়ে ফেলা বা চিরে ফেলা; to tear up অর্থ হল ছিঁড়ে টুকরো টুকরো করে নষ্ট করা।\nNote: সম্পূর্ণতার ধারণা প্রকাশ করতে verb-এর সাথে প্রায়ই up যুক্ত হয়, যেমন: burn up, drink up, dry up, cut up, eat up, shut up, use up.","pg":81,"q":true},{"n":408,"title":"Grow এবং Grow up","dont":["These flowers grow up very quickly.","When I grow I’ll be a doctor."],"say":["These flowers grow very quickly.","When I grow up I’ll be a doctor."],"note":"To grow অর্থ হল বড় হওয়া / বৃদ্ধি পাওয়া; to grow up অর্থ হল প্রাপ্তবয়স্ক হওয়া।\nNote: Grow-এর অন্যান্য অর্থ: 1) জন্মানো / ফলা, যেমন: Rice grows in Egypt; 2) চাষ করা / জন্মানো, যেমন: We grow flowers in our garden; 3) রাখা / বাড়তে দেওয়া, যেমন: He grew a beard; 4) হয়ে ওঠা, যেমন: The nights grow cold in winter.","pg":82,"q":true},{"n":409,"title":"Pick এবং Pick up","dont":["We picked up flowers in the garden.","The naughty boy picked a stone."],"say":["We picked flowers in the garden.","The naughty boy picked up a stone."],"note":"To pick fruit or flowers অর্থ হল (আঙুল দিয়ে) ফল বা ফুল তোলা / ছেঁড়া; to pick up অর্থ হল (কোনো জিনিস) মাটি থেকে তুলে নেওয়া।\nসতর্কতা: “We picked up flowers in the garden.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":82,"q":false},{"n":410,"title":"Deal with এবং Deal in","dont":["This book deals in common errors.","A bookseller deals with books."],"say":["This book deals with common errors.","A bookseller deals in books."],"note":"To deal with অর্থ হল কোনো বিষয় নিয়ে আলোচনা করা / সংশ্লিষ্ট হওয়া; to deal in অর্থ হল কোনো কিছুর ব্যবসা (কেনা-বেচা) করা।\nNote: To deal with আরও অর্থ নির্দেশ করে: 1) লেনদেন করা, যেমন: I will not deal with that shopkeeper again; 2) কোনো বিষয়ের ব্যবস্থা নেওয়া, যেমন: The headmaster will deal with the question.","pg":82,"q":true},{"n":411,"title":"Interfere in এবং Interfere with","dont":["Don’t interfere with my private business!","Paul is always interfering in the equipment."],"say":["Don’t interfere in my private business!","Paul is always interfering with the equipment."],"note":"To interfere in অর্থ হল অন্যের ব্যাপারে নাক গলানো; to interfere with অর্থ হল কোনো জিনিস নিয়ে নাড়াচাড়া করা বা কোনো কিছুতে বাধা সৃষ্টি করা।","pg":83,"q":true},{"n":412,"title":"Borrow এবং Lend","dont":["I want to lend a book from you.","Will you please borrow me a book?"],"say":["I want to borrow a book from you.","Will you please lend me a book?"],"note":"To borrow অর্থ হল ধার নেওয়া এবং to lend অর্থ হল ধার দেওয়া।","pg":83,"q":true},{"n":413,"title":"Steal এবং Rob","dont":["Someone has robbed all her money.","Some men stole a bank last night."],"say":["Someone has stolen all her money.","Some men robbed a bank last night."],"note":"Steal (চুরি করা)-এর object হল সেই জিনিস যা চুরি হয়, যেমন: টাকা, ঘড়ি, সাইকেল ইত্যাদি। পক্ষান্তরে rob (ডাকাতি / লুট করা)-এর object হল সেই ব্যক্তি বা স্থান যার কাছ থেকে (বা যেখান থেকে) জিনিসটি নেওয়া হয়, যেমন: a man, a house বা a bank।","pg":83,"q":true},{"n":414,"title":"Revenge এবং Avenge","dont":["I avenged myself for the insult.","He now revenged his son’s murder."],"say":["I revenged myself for the insult.","He now avenged his son’s murder."],"note":"To revenge oneself হল নিজের প্রতি করা অন্যায়ের জন্য কাউকে শাস্তি দেওয়া; পক্ষান্তরে to avenge হল অন্যের (সাধারণত নিরীহ বা দুর্বলের) প্রতি করা অন্যায়ের প্রতিশোধ নেওয়া।\nNote: Revenge noun হিসেবে to take revenge on এবং to get or have one’s revenge — এই expression-গুলোতে ব্যবহৃত হয়, যেমন: He took revenge on the boy who had struck him; He could not rest until he had his revenge.\nসতর্কতা: আধুনিক ইংরেজিতে “I avenged myself for the insult.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":84,"q":false},{"n":415,"title":"Convince এবং Persuade","dont":["I am now persuaded of his honesty.","We could not convince him to play."],"say":["I am now convinced of his honesty.","We could not persuade him to play."],"note":"To convince হল কাউকে কোনো কি
