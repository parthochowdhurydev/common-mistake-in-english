<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Common Mistakes in English — Study App</title>
<style>
:root{color-scheme:light;--bg:#f3e8da;--card:#fffaf2;--ink:#3b2a20;--mut:#7d6757;--line:#e4d3bf;--pri:#8b5a3c;--pri2:#f1e1cf;--ok:#2f6b3a;--okbg:#e9f1e0;--bad:#a3262a;--badbg:#f9e4de;--warn:#a8641a;--warnbg:#fbeccd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
/* daily target */
#daily{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#daily .row{display:flex;align-items:center;gap:10px;padding:8px 0}
#daily h1{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);white-space:nowrap}
.bars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{font-size:11px;color:var(--mut);min-width:0}
.bar span{white-space:nowrap}
@media (max-width:420px){#daily h1 .lbl{display:none}}
.bar .t{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
.bar .t i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.bar.done .t i{background:var(--ok)}
.streak{font-size:13px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px}
#tset{display:none;padding:0 0 10px;font-size:14px}
#tset.open{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#tset input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:12px;color:var(--mut)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:600}
section.view{display:none;padding:12px 0}
section.view.on{display:block}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select,.inp{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
input[type=search]{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri);font-size:12px;margin-right:4px}
.dont,.say{padding:7px 10px;border-radius:10px;margin:6px 0}
.dont{background:var(--badbg);color:var(--bad)}
.say{background:var(--okbg);color:var(--ok)}
.dont:before{content:"✗ Don't say: ";font-weight:600}
.say:before{content:"✓ Say: ";font-weight:600}
.note{font-size:14px;color:var(--mut);margin-top:6px;white-space:pre-wrap}
.ttl{font-weight:600}
.num{color:var(--pri);margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);padding:11px 13px;border-radius:12px;margin:8px 0}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.sel{background:var(--pri2);border-color:var(--pri);font-weight:600}
.sent{font-size:17px;line-height:2;margin:2px 0 6px}
.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;border-radius:4px;padding:0 1px}
.ul.good{background:var(--okbg);color:var(--ok)}
.ul.bad{background:var(--badbg);color:var(--bad)}
.lab{font-size:11px;font-weight:700;color:var(--pri);vertical-align:-3px;margin-left:1px}
.blank{color:var(--pri);font-weight:700;letter-spacing:1px}
.fb{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.fx{margin:6px 0;padding:7px 10px;border-radius:10px;background:var(--okbg);color:var(--ok)}
.ex{font-size:14.5px;margin:6px 0;line-height:1.55}
.ex .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);background:var(--pri2);border-radius:6px;padding:0 6px;margin-right:6px}
.ex.nt{color:var(--warn)}
.opt b{color:var(--pri)}

.opt[disabled]{opacity:1;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--pri)}
.flip{min-height:150px;display:flex;flex-direction:column;justify-content:center}
.hit{background:var(--warnbg);padding:1px 3px;border-radius:4px}
.res{border-left:4px solid var(--bad);padding-left:10px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>
<body>
<header id="daily"><div class="wrap">
 <div class="row">
  <h1>🎯 <span class="lbl">Daily target</span></h1>
  <div class="bars">
   <div class="bar" id="bS"><span id="bSt">Study 0/10</span><div class="t"><i></i></div></div>
   <div class="bar" id="bP"><span id="bPt">Practice 0/20</span><div class="t"><i></i></div></div>
  </div>
  <span class="streak" id="streak">🔥 0</span>
  <button class="iconbtn" id="gear" aria-label="Set target">⚙</button>
 </div>
 <div id="tset">
  <label>Study items/day <input type="number" id="tS" min="1" max="100"></label>
  <label>Practice questions/day <input type="number" id="tP" min="1" max="200"></label>
  <button class="btn sm pri" id="tSave">Save</button>
 </div>
</div></header>

<div class="wrap">
<section class="view on" id="v-study">
 <h2 style="font-size:18px;margin:2px 0 6px">📖 Study</h2>
 <div class="card" id="readbox" style="padding:6px 10px;margin:4px 0 8px;border-radius:10px"></div>
 <div class="row2">
  <input type="search" id="sq" placeholder="Search rule or sentence…">
 </div>
 <div class="row2" style="margin-top:8px">
  <select id="sg"></select>
  <select id="sf"><option value="all">All</option><option value="new">Not read yet</option><option value="done">Read (পড়া হয়েছে)</option><option value="star">Starred</option></select>
 </div>
 <div class="mut" id="scount" style="margin:8px 2px"></div>
 <div id="slist"></div>
 <div class="empty" id="smore" style="display:none"><button class="btn" id="smoreb">Show more</button></div>
</section>

<section class="view" id="v-practice">
 <h2>✍️ Practice</h2>
 <div class="stats" id="pstats"></div>
 <div class="card">
  <div class="row2">
   <select id="pmode"><option value="mcq">Pick the correct sentence</option><option value="flash">Flashcards</option></select>
   <select id="psrc"><option value="all">All questions</option><option value="read">Rules I have read</option><option value="new">Not read yet</option><option value="wrong">My mistakes</option><option value="star">Starred</option></select>
   <button class="btn pri" id="pstart">Start</button>
  </div>
 </div>
 <div id="parea"></div>
</section>

<section class="view" id="v-exam">
 <h2>📝 Exam</h2>
 <div id="exsetup">
  <div class="card">
   <p style="margin-top:0">Timed mock test. 4 options per question, only one is correct. Pass mark: 60%.</p>
   <div class="row2" style="margin-bottom:8px">
    <select id="exsrc" class="inp"><option value="read">Only rules I have read (পড়া নিয়ম)</option><option value="all">All rules</option></select>
   </div>
   <div class="mut" id="exinfo" style="margin-bottom:8px"></div>
   <div class="row2">
    <select id="exn"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
    <span class="mut">questions · 30 sec each</span>
    <button class="btn pri" id="exstart">Start exam</button>
   </div>
  </div>
  <h3 style="margin:16px 2px 4px;font-size:16px">History</h3>
  <div id="exhist"></div>
 </div>
 <div id="exrun" style="display:none"></div>
</section>


<section class="view" id="v-toefl">
 <h2>🎓 TOEFL Mini Tests</h2>
 <div id="tfhome"></div>
 <div id="tfrun" style="display:none"></div>
</section>
</div>

<nav>
 <button data-t="study" class="on"><b>📖</b>Study</button>
 <button data-t="practice"><b>✍️</b>Practice</button>
 <button data-t="exam"><b>📝</b>Exam</button>
 <button data-t="toefl"><b>🎓</b>TOEFL</button>
</nav>

<script>
const DATA={"items":[{"n":1,"title":"Absorbed (= গভীরভাবে নিবিষ্ট বা নিমগ্ন) in, at বসবে না।","dont":["The man was absorbed at his work."],"say":["The man was absorbed in his work."],"note":"Note: Absorbed (= very much interested)-এর পরে appropriate preposition ‘in’ বসে। Absorbed-এর পরে ‘at’ বসে না।","pg":3,"q":true},{"n":2,"title":"Accuse of (অভিযুক্ত করা / দোষী করা), for নয়।","dont":["She accused the man for stealing."],"say":["She accused the man of stealing."],"note":"Note: Charge-এর পরে with বসে; যেমন: The man was charged with murder.","pg":3,"q":true},{"n":3,"title":"Accustomed to (অভ্যস্ত হওয়া), with বসবে না।","dont":["I'm accustomed with hot weather."],"say":["I'm accustomed to hot weather."],"note":"Note: একইভাবে used to (অভ্যস্ত), যেমন: He is used to the heat.","pg":3,"q":true},{"n":4,"title":"Afraid of (ভীত / শঙ্কিত), from বসবে না।","dont":["Laura is afraid from the dog."],"say":["Laura is afraid of the dog."],"note":"Note: Afraid অর্থ ভীত; এরপর সঠিক preposition হল ‘of’, ‘from’ বসানো সঠিক নয়।","pg":3,"q":true},{"n":5,"title":"Aim at (তাক করা), on বা against বসবে না।","dont":["She aimed on (or against) the target."],"say":["She aimed at the target."],"note":"Note: At preposition-টি প্রায়ই লক্ষ্য বা গতিপথ নির্দেশ করতে ব্যবহৃত হয়, যেমন- throw at (ছুঁড়ে মারা), shout at (কারো প্রতি চিৎকার করা), fire at (লক্ষ্য করে গুলি করা), shoot at (তাক করে গুলি ছোড়া)। তবে at ব্যতীত shoot আঘাত করে হত্যা করা অর্থ নির্দেশ করে, যেমন- He shot a bird (= সে পাখিটিকে গুলি করলো এবং এটা মারা গেল)।","pg":3,"q":true},{"n":6,"title":"Angry with (রাগান্বিত / ক্রুদ্ধ / রুষ্ট), against নয়।","dont":["The teacher was angry against him."],"say":["The teacher was angry with him."],"note":"Note-1: আমরা ব্যক্তির প্রতি angry with হই, কিন্তু বস্তুর প্রতি angry at হই, যেমন: He was angry at the weather (with the weather নয়)।\nNote-2: একইভাবে ব্যক্তির ক্ষেত্রে annoyed (বিরক্ত) with, vexed (বিরক্ত) with, indignant (ক্ষুব্ধ) with বসে; কিন্তু বস্তুর ক্ষেত্রে এদের পরে with-এর পরিবর্তে at বসে।","pg":4,"q":true},{"n":7,"title":"Anxious (= troubled; উদ্বিগ্ন / উৎকণ্ঠিত) about, for নয়।","dont":["They’re anxious for his health."],"say":["They’re anxious about his health."],"note":"Note: তবে anxious যখন ‘তীব্রভাবে কামনা করা / প্রত্যাশী’ (wishing very much) অর্থে ব্যবহৃত হয়, তখন about-এর পরিবর্তে for বসে, যেমন- Parents are anxious for their children’s success.","pg":4,"q":true},{"n":8,"title":"Arrive (পৌঁছানো) at, to নয়।","dont":["We arrived to the village at night."],"say":["We arrived at the village at night."],"note":"Note: দেশ এবং বড় শহরের ক্ষেত্রে arrive in ব্যবহৃত হয়, যেমন- Mr Smith has arrived in London (or New York, India, etc.).","pg":4,"q":true},{"n":9,"title":"Ashamed (লজ্জিত) of, from নয়।","dont":["He's now ashamed from his conduct."],"say":["He's now ashamed of his conduct."],"note":"Note: লাজুক (shy) অর্থে ashamed of ব্যবহার করা যথার্থ নয়। সুতরাং I am ashamed of my teacher-এর পরিবর্তে বলা উচিত I am shy of my teacher.","pg":4,"q":true},{"n":10,"title":"Believe (আস্থা / বিশ্বাস থাকা) in, to নয়।","dont":["We believe to God."],"say":["We believe in God."],"note":"Note: To believe in অর্থ হল আস্থা / বিশ্বাস থাকা (to have faith in)। পক্ষান্তরে to believe (in ব্যতীত) অর্থ হল কোনো কিছুকে সত্য বলে মেনে নেওয়া, যেমন- I believe everything he says.","pg":4,"q":true},{"n":11,"title":"Boast of or about (অহংকার করা), for নয়।","dont":["James boasted for his strength."],"say":["James boasted of (or about) his strength."],"note":"","pg":5,"q":true},{"n":12,"title":"Careful of, with or about (যত্নবান / মনোযোগী), for নয়।","dont":["Elke’s very careful for her health."],"say":["Elke’s very careful of / about her health."],"note":"Or: You should be more careful with your money. Note: Take care of (ব্যবস্থা করা / ভার নেওয়া): যেমন- He takes care of his money.","pg":5,"q":true},{"n":13,"title":"Travel by train ইত্যাদি, with the train ইত্যাদি নয়।","dont":["He travelled with the train yesterday."],"say":["He travelled by train yesterday."],"note":"Note: আমরা বলি, by train, by tram, by boat, by aeroplane, আবার by land, by sea, by air, by bus, in a bus, বা on a bus; by motor-car বা in a motor-car, by taxi বা in a taxi; in a cab, in a carriage; on horse-back, on a donkey, on a bicycle; on foot.","pg":5,"q":true},{"n":14,"title":"Complain about (অসন্তোষ, অন্যায়, দুর্ভোগ, যন্ত্রণা), for নয়।","dont":["Annette complained for the weather."],"say":["Annette complained about the weather."],"note":"Note: আমরা যখন অসুস্থতার কথা বলি তখন complain of ব্যবহার করি। আমরা বলি She complained of a sore throat.","pg":5,"q":true},{"n":15,"title":"Composed of (গঠিত), from নয়।","dont":["Our class is composed from thirty students."],"say":["Our class is composed of thirty students."],"note":"","pg":5,"q":true},{"n":16,"title":"Confidence in (আত্মবিশ্বাস / আস্থা), to নয়।","dont":["I have great confidence to you."],"say":["I have great confidence in you."],"note":"Note: In confidence এটিও; যেমন: Let me tell you something in confidence (as a secret গোপনে)","pg":5,"q":true},{"n":17,"title":"Conform to (অনুরূপ / একমত হওয়া), with নয়।","dont":["We must conform with the rules."],"say":["We must conform to the rules."],"note":"Note: তবে, comply (রাজি হওয়া / সম্মত হওয়া / মত দেয়া)-এরপর with বসে: যেমন- We'll comply with your request.\nসতর্কতা: আধুনিক ইংরেজিতে “We must conform with the rules.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":5,"q":false},{"n":18,"title":"Congratulate on (অভিনন্দন জানানো), for নয়।","dont":["I congratulate you for your success."],"say":["I congratulate you on your success."],"note":"Note: Congratulate (অভিনন্দন জানানো)-এর পরে on বসে, for নয়। Congratulation (বিশেষ্য)-এর পরেও on বসে, যেমন: Congratulations on your success!","pg":5,"q":true},{"n":19,"title":"Consist of (গঠিত হওয়া), from নয়।","dont":["A year consists from twelve months."],"say":["A year consists of twelve months."],"note":"Note: সতর্ক থাকুন: consist কখনও passive voice-এ ব্যবহার করবেন না।","pg":6,"q":true},{"n":20,"title":"Covered with (ছেয়ে যাওয়া, আচ্ছাদিত হওয়া), by নয়।","dont":["The mountains are covered by snow."],"say":["The mountains are covered with / in snow."],"note":"সতর্কতা: আধুনিক ইংরেজিতে “The mountains are covered by snow.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":6,"q":false},{"n":21,"title":"Cure of (আরোগ্য / চিকিৎসা / মুক্ত করা), from নয়।","dont":["The man was cured from his illness."],"say":["The man was cured of his illness."],"note":"Note: কিন্তু cure যখন Noun হিসেবে বসে সে ক্ষেত্রে for (রোগ)-কে গ্রহণ করে। যেমন: There is no cure for that disease, অন্যদিকে cure এরপরে preposition from বসে না।","pg":6,"q":true},{"n":22,"title":"Depend on or upon (নির্ভর / অবলম্বন করা, নির্ভরশীল / মুখাপেক্ষী হওয়া), from নয়।","dont":["It depends from her."],"say":["It depends on (or upon) her."],"note":"Note: Rely (নির্ভর / ভরসা করা)-এর পরেও on বা upon বসে, যেমন: I can't rely on (or upon) him.","pg":6,"q":true},{"n":23,"title":"Deprive of (বঞ্চিত / বিরহিত করা), from নয়।","dont":["Nelson Mandela was deprived from his freedom."],"say":["Nelson Mandela was deprived of his freedom."],"note":"","pg":6,"q":true},{"n":24,"title":"Die of an illness (রোগ / অসুস্থতার জন্য মারা যাওয়া), from an illness নয়।","dont":["Many people have died from malaria."],"say":["Many people have died of malaria."],"note":"Note: কেউ যখন রোগ / অসুস্থতা, অনাহার / ক্ষুধা, পিপাসা, দুঃখ ইত্যাদি হতে মারা যাওয়া বোঝাতে die-এর পরে of বসে। অত্যধিক পরিশ্রম (overwork) হতে মারা যাওয়া বোঝাতে from বসে। সহিংসতা (violence), তরবারি (sword), মহামারী (pestilence) ইত্যাদি হতে মারা যাওয়া বোঝাতে by বসে। যুদ্ধে, অভাবে মারা যাওয়া বোঝাতে in বসে। দেশের জন্য আত্মদান বোঝাতে for বসে। কোন কারণে মারা যাওয়া বোঝাতে for, অবহেলার কারণে মারা যাওয়া বোঝাতে through, নাট্যমঞ্চে মারা যাওয়া বোঝাতে to বসে এবং ঝুঁকির মধ্যে মারা যাওয়া বোঝাতে at বসে।\nসতর্কতা: আধুনিক ইংরেজিতে “Many people ball."],"say":["I enjoy playing football."],"note":"Note: Like (পছন্দ করা) বা dislike (অপছন্দ করা) এই verb দুটির পরে infinitive বা gerund বসতে পারে, যেমন: He likes reading English books, or He likes to read English books.","pg":16,"q":true},{"n":88,"title":"Excuse (ক্ষমা করা) + -ing.","dont":["Please excuse me to be so late."],"say":["Please excuse my being so late."],"note":"Or: Please excuse me for being so late.","pg":16,"q":true},{"n":89,"title":"Finish (শেষ / সম্পূর্ণ করা) + -ing.","dont":["Have you finished to speak?"],"say":["Have you finished speaking?"],"note":"Note: Begin (আরম্ভ / শুরু করা)-এর পরে to + infinitive বা gerund উভয়টিই বসতে পারে, যেমন: She began to speak, বা She began speaking.","pg":16,"q":true},{"n":91,"title":"Mind (আপত্তি করা / কিছু মনে করা) + -ing.","dont":["Would you mind to open the door?"],"say":["Would you mind opening the door?"],"note":"","pg":17,"q":true},{"n":92,"title":"Practise (অনুশীলন / চর্চা করা) + -ing.","dont":["You must practise to speak English."],"say":["You must practise speaking English."],"note":"","pg":17,"q":true},{"n":93,"title":"Remember (মনে রাখা / স্মরণ করা) + -ing.","dont":["I don’t remember to have seen him."],"say":["I don't remember seeing him."],"note":"Or: I don’t remember having seen him.","pg":17,"q":true},{"n":94,"title":"Risk (ঝুঁকি নেওয়া) + -ing.","dont":["We couldn't risk to leave him alone."],"say":["We couldn't risk leaving him alone."],"note":"","pg":17,"q":true},{"n":95,"title":"Stop (থামিয়ে দেওয়া / ব্যাহত করা) + -ing.","dont":["The wind has almost stopped to blow."],"say":["The wind has almost stopped blowing."],"note":"Note: Give up (পরিত্যাগ করা)-এর পরেও gerund বসে, যেমন: He gave up smoking.","pg":17,"q":true},{"n":96,"title":"Busy (ব্যস্ত) + -ing.","dont":["He was busy to revise for the exams."],"say":["He was busy revising for the exams."],"note":"","pg":17,"q":true},{"n":97,"title":"Worth (বিশেষ মূল্য বিশিষ্ট) + -ing.","dont":["Is today’s film worth to see?"],"say":["Is today’s film worth seeing?"],"note":"","pg":17,"q":true},{"n":98,"title":"Have difficulty in (অসুবিধা / সমস্যা থাকা) + -ing.","dont":["She has no difficulty to do it."],"say":["She has no difficulty in doing it."],"note":"","pg":17,"q":true},{"n":99,"title":"Have the pleasure of (আনন্দিত হওয়া / থাকা) + -ing.","dont":["I had the pleasure to meet him."],"say":["I had the pleasure of meeting him."],"note":"Note: সর্বদাই take pleasure in (আনন্দ পাওয়া)-এরপর verb আসলে gerund বসে, যেমন: He takes great pleasure in helping the poor.","pg":17,"q":true},{"n":100,"title":"It’s no use (মূল্য / লাভ নেই) + -ing.","dont":["It's no use to cry like a baby."],"say":["It's no use crying like a baby."],"note":"","pg":18,"q":true},{"n":101,"title":"It’s no good (কোনো লাভ নেই) + -ing.","dont":["It's no good to get angry."],"say":["It's no good getting angry."],"note":"","pg":18,"q":true},{"n":102,"title":"Look forward to (আশা করা / প্রতীক্ষা করা) + -ing.","dont":["I look forward to see him soon."],"say":["I look forward to seeing him soon."],"note":"","pg":18,"q":true},{"n":103,"title":"There is no harm in (কোনো দোষ নেই) + -ing.","dont":["There's no harm to visit her now."],"say":["There's no harm in visiting her now."],"note":"","pg":18,"q":true},{"n":104,"title":"Did-এর পরে to ব্যতীত infinitive-এর পরিবর্তে past tense ব্যবহার জনিত ভুল (Using the past tense after did instead of the infinitive without to):","dont":["Did you went to school yesterday?","I did not went to school yesterday."],"say":["Did you go to school yesterday?","I did not go to school yesterday."],"note":"প্রশ্ন করতে (a) এবং না-বোধক বাক্য করতে (b) did auxiliary verb-এর পরে to ব্যতীত present infinitive (verb-এর মূল রূপ) বসবে, past tense নয়।\nNote: Did দিয়ে শুরু প্রশ্নের উত্তরে past tense হয়, যেমন: Did you see the picture? — Yes, I saw the picture, বা Yes, I did.","pg":19,"q":true},{"n":105,"title":"Does-এর পরে to ব্যতীত infinitive-এর পরিবর্তে third person singular ব্যবহার জনিত ভুল:","dont":["Does the gardener waters the flowers?","The man doesn’t waters the flowers."],"say":["Does the gardener water the flowers?","The man doesn’t water the flowers."],"note":"প্রশ্ন করতে (a) এবং না-বোধক বাক্য করতে (b) does auxiliary verb-এর পরে to ব্যতীত present infinitive (verb-এর মূল রূপ) বসবে, -s / -es যুক্ত third person রূপ নয়।\nNote: Does দিয়ে শুরু প্রশ্নের উত্তরে present tense-এর third person রূপ হয়, যেমন: Does he like the cinema? — Yes, he likes the cinema, বা Yes, he does.","pg":19,"q":true},{"n":106,"title":"Can, must ইত্যাদির পরে to ব্যতীত infinitive এর পরিবর্তে third person singular ব্যবহার জনিত ভুল:","dont":["He can speaks English very well."],"say":["He can speak English very well."],"note":"Can, must, may, shall এবং will — এদের পরে to ব্যতীত infinitive (verb-এর মূল রূপ) বসবে; present tense-এর third person -s যুক্ত রূপ বসবে না।","pg":19,"q":true},{"n":107,"title":"Past tense-এর পরে present tense ব্যবহার জনিত ভুল (Sequence of tenses):","dont":["Rachel asked me what I am doing."],"say":["Rachel asked me what I was doing."],"note":"Principal clause-এর verb যখন past tense-এ থাকে, তখন subordinate clause-এর verb-ও past tense-এ হয়।\nNote: এই নিয়মটি কয়েকটি ক্ষেত্রে প্রযোজ্য নয়: 1) direct speech-এ, 2) যেসকল ঘটনা সবসময় সত্য (চিরন্তন সত্য), সেগুলোতে, 3) than দিয়ে তুলনা করতে। যেমন:\na. She said, ‘I am waiting for your answer.’\nb. He said that London is a great city.","pg":20,"q":true},{"n":108,"title":"Subordinate clause-এ should / would-এর পরিবর্তে shall / will ব্যবহার জনিত ভুল:","dont":["He said (that) he will come tomorrow."],"say":["He said (that) he would come tomorrow."],"note":"যখন principal clause-এর verb past tense-এ হয়, তখন subordinate clause-এর shall এবং will / ’ll যথাক্রমে should এবং would / ’d-এ পরিবর্তিত হয়।","pg":20,"q":true},{"n":109,"title":"Subordinate clause-এর might-এর পরিবর্তে may ব্যবহার জনিত ভুল:","dont":["Last Sunday Ailsa told me that she may come."],"say":["Last Sunday Ailsa told me that she might come."],"note":"যখন principal clause-এর verb past tense-এ হয়, তখন may, might-এ পরিবর্তিত হয়।\nNote: Conjunction that-এর পরে কখনও comma (,) বসে না।","pg":20,"q":true},{"n":110,"title":"Subordinate clause-এর could-এর পরিবর্তে can ব্যবহার জনিত ভুল","dont":["Ben thought he can win the prize."],"say":["Ben thought he could win the prize."],"note":"যখন principal clause-এর verb past tense-এ হয়, তখন can, could-এ পরিবর্তিত হয়।","pg":20,"q":true},{"n":111,"title":"Infinitive-এর চিহ্ন to-এর পরে past tense ব্যবহার জনিত ভুল:","dont":["He tried to kicked the ball away."],"say":["He tried to kick the ball away."],"note":"Infinitive-এর চিহ্ন to-এর পরে past tense ব্যবহৃত হতে পারে না; সেখানে verb-এর মূল রূপ বসে।","pg":20,"q":true},{"n":113,"title":"অতীত কর্তব্য / বাধ্যবাধকতা প্রকাশ করতে must বা ought ব্যবহার জনিত ভুল:","dont":["You ought to come yesterday."],"say":["You ought to have come yesterday."],"note":"Or: You should have come yesterday.\nPast tense হিসেবে must এবং ought ব্যবহৃত হতে পারে না। অতীতের কর্তব্য (যা করা হয়নি) প্রকাশ করতে ought to বা should-এর পরে perfect infinitive (have + past participle) ব্যবহার করুন; আর অতীতের বাধ্যবাধকতা বোঝাতে had to বা was obliged to ব্যবহার করুন।\nNote: Indirect speech-এ must এবং ought past tense হিসেবে ব্যবহৃত হতে পারে, যেমন: He said he must do it.","pg":21,"q":true},{"n":114,"title":"Past tense-এর পরিবর্তে present perfect ব্যবহার জনিত ভুল:","dont":["I have seen a good film yesterday."],"say":["I saw a good film yesterday."],"note":"অতীতের নির্দিষ্ট সময়ে কোনো কাজ সম্পন্ন হয়েছে বোঝাতে past tense ব্যবহৃত হবে, present perfect নয়।\nNote: বাক্যে অতীত সময় নির্দেশক কোনো word বা phrase থাকলে, যেমন: yesterday, last night, last week, last year, then, ago ইত্যাদি, তখন অবশ্যই past tense ব্যবহার করতে হবে।","pg":21,"q":true},{"n":115,"title":"Present perfect-এর পরিবর্তে simple past tense ব্যবহার জনিত ভুল:","dont":["I saw the Parthenon of Athens."],"say":["I have seen the Parthenon of Athens."],"note":"অতীত কাজের বর্তমান ফলাফল (বা অভিজ্ঞতা) সম্বন্ধে বললে আমরা অবশ্যই present perfect tense ব্যবহার করব। কেউ যখন বলে I have seen the Parthenon, তখন বোঝায় যে এটি দেখার অভিজ্ঞতা তার এখনও আছে।\nসতর্কতা: “I saw the Parthenon of Athens.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":21,"q":false},{"n":116,"title":"সাম্প্রতিক কাজের ক্ষেত্রে present perfect-এর পরিবর্তে past tense ব্যবহার জনিত ভুল:","dont":["The clock struck."],"say":["The clock has struck."],"note":"সবেমাত্র শেষ হওয়া কোনো কাজ সম্পর্কে বললে আমরা past tense-এর পরিবর্তে present perfect ব্যবহার করব। যেমন, ঘড়ির ঘণ্টা বাজার ঠিক পরেই বলা উচিত: The clock has struck.\nসতর্কতা: “The clock struck.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":21,"q":false},{"n":117,"title":"Present perfect-এর পরিবর্তে simple present ব্যবহার জনিত ভুল:","dont":["I'm at this school two years."],"say":["I've been at this school two years."],"note":"কোন কাজ অতীতে শুরু হয়েছিল এবং চলতে চলতে বর্তমানে প্রবেশ করেছে, এটি প্রকাশ করতে অবশ্যই present perfect (simple present নয়) ব্যবহৃত হবে। I've been at this school two years অর্থ হল- I’m still here (আমি এখনও এখানে আছি)।","pg":22,"q":true},{"n":118,"title":"সময় প্রকাশক ‘since’ clause-এর পরে, present perfect tense-এর পরিবর্তে simple present ব্যবহার জনিত ভুল:","dont":["Since he came, we're happy."],"say":["Since he came, we've been happy."],"note":"সময় প্রকাশক ‘since’ clause-এর main verb সাধারণত present perfect tense-এ হয়।","pg":22,"q":true},{"n":119,"title":"Present continuous-এর পরিবর্তে simple present ব্যবহার জনিত ভুল:","dont":["Look! Two boys fight."],"say":["Look! Two boys are fighting."],"note":"কথা বলার মুহূর্তে কোনো কাজ চলছে, তা প্রকাশ করতে অবশ্যই present continuous (simple present নয়) ব্যবহৃত হবে।\nNote: নিকট ভবিষ্যতের কোনো পরিকল্পিত কাজ প্রকাশ করতেও present continuous ব্যবহৃত হয়, বিশেষত come, go, leave, arrive-এর মতো গতি প্রকাশক verb-এর সাথে, যেমন: He is leaving for England soon; Lorna is arriving tomorrow at six; Tom and I are eating out tonight.","pg":22,"q":true},{"n":120,"title":"Tense-এর continuous রূপটির অপব্যবহার:","dont":["I'm understanding the lesson now."],"say":["I understand the lesson now."],"note":"Note: সাধারণ নিয়ম হিসেবে, যে verb কাজের চেয়ে অবস্থা নির্দেশ করে, সেগুলোর continuous form হয় না, যেমন: understand, know, believe, like, love, belong, prefer, consist, mean, hear, see ইত্যাদি।","pg":22,"q":true},{"n":122,"title":"বর্তমান অভ্যাসগত কাজ প্রকাশ করতে use verb ব্যবহার জনিত ভুল:","dont":["I use to get up at six every morning."],"say":["I get up at six every morning."],"note":"Or: I’m accustomed to getting up at six, etc.\nউল্লেখ্য, অতীতের অভ্যাসগত কাজ বোঝাতে used to ব্যবহৃত হয় — যা অতীতে নিয়মিত হত কিন্তু এখন আর হয় না, যেমন: I used to see him every day; My father used to play football very well.","pg":23,"q":true},{"n":123,"title":"অতীত অভ্যাসগত কাজ প্রকাশ করতে simple past tense-এর পরিবর্তে past continuous ব্যবহার জনিত ভুল:","dont":["Last year I was walking to school every day."],"say":["Last year I walked to school every day."],"note":"Note: অতীতে একটি ঘটনা চলাকালীন অন্য একটি ঘটনা ঘটলে, চলমান ঘটনাটি বর্ণনা করতে past continuous tense ব্যবহৃত হয়, যেমন: I was walking to school when I met him.\nসতর্কতা: “Last year I was walking to school every day.” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":23,"q":false},{"n":124,"title":"Past perfect-এর পরিবর্তে past tense ব্যবহার জনিত ভুল:","dont":["The train already left before I arrived."],"say":["The train had already left before I arrived."],"note":"অতীতের দুটি কাজের মধ্যে যেটি আগে সম্পন্ন হয় সেটির জন্য past perfect tense এবং যেটি পরে সম্পন্ন হয় সেটির জন্য past tense ব্যবহৃত হয়।\nNote: একই বাক্যে present tense এবং past perfect tense একসাথে ব্যবহার করা উচিত নয়। সুতরাং বলা ভুল হবে: My brother says that he had not gone to the cinema last night.","pg":23,"q":true},{"n":125,"title":"Simple past tense-এর পরিবর্তে past perfect ব্যবহার জনিত ভুল:","dont":["I'd finished the book yesterday."],"say":["I finished the book yesterday."],"note":"অন্য একটি verb past tense-এ না থাকলে কোনো বাক্যে past perfect ব্যবহার করা উচিত নয়। (See Section 124)","pg":23,"q":true},{"n":126,"title":"সময় প্রকাশক clause-এ present tense-এর পরিবর্তে future tense ব্যবহার জনিত ভুল:","dont":["I'll see you when I shall come back."],"say":["I'll see you when I come back."],"note":"যদি principal clause-এর verb future tense-এ হয়, তবে সময় প্রকাশক clause-টির verb present tense-এ হবে।","pg":23,"q":true},{"n":127,"title":"If clause-এর present tense-এর পরিবর্তে future tense ব্যবহার জনিত ভুল:","dont":["If he’ll ask me, I’ll stay."],"say":["If he asks me, I’ll stay."],"note":"সাধারণ ভবিষ্যৎ শর্তে, শর্ত বাক্যাংশ (if-clause)-টিতে present tense এবং principal clause-এ future tense ব্যবহৃত হয়।\nNote: তবে অনুরোধ প্রকাশ করতে if-clause-এ will ব্যবহৃত হতে পারে, যেমন: I shall be very grateful if you will lend me some money; If you will give me some money, I'll buy you a drink.","pg":24,"q":true},{"n":128,"title":"As if বা as though-এর পরে past tense-এর পরিবর্তে present tense ব্যবহার জনিত ভুল:","dont":["Janine talks as if she knows everything."],"say":["Janine talks as if she knew everything."],"note":"As if বা as though-এর পরে past tense ব্যবহৃত হওয়া উচিত। He talks as if he knew everything মানে হল, সে এমনভাবে কথা বলে যেন সে সবকিছু জানে।\nNote: Verb to be-এর ক্ষেত্রে as if-এর পরে were ব্যবহৃত হয়, যেমন: He acts as if he were a rich man.\nসতর্কতা: আধুনিক ইংরেজিতে “Janine talks as if she knows everything.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":24,"q":false},{"n":129,"title":"Wish-এর present tense-এর পরিবর্তে would wish ব্যবহার জনিত ভুল:","dont":["I would wish to know more English."],"say":["I wish (that) I knew more English."],"note":"বর্তমান সময়ের ইচ্ছা প্রকাশ করতে wish-এর present tense ব্যবহৃত হয় এবং এর পরের that clause-টি past tense-এ হয়।","pg":24,"q":true},{"n":132,"title":"Finite verb-এর পরিবর্তে infinitive ব্যবহার জনিত ভুল:","dont":["Sir, to go home to get my book?"],"say":["Sir, may I go home to get my book?"],"note":"Infinitive person, number অথবা time-এর সাথে সম্পর্ক ছাড়াই কেবল একটি কাজের নাম প্রকাশ করে। সুতরাং finite verb-এর সাহায্য ছাড়া এটি কোনো পূর্ণ বক্তব্য প্রকাশ করতে পারে না।","pg":25,"q":true},{"n":133,"title":"Tense-এর তালগোল পাকিয়ে ফেলা (Mixing tenses):","dont":["They asked him to be captain, but he refuses."],"say":["They asked him to be captain, but he refused."],"note":"যদি আপনি অতীত সময় নির্দেশক verb দ্বারা শুরু করেন, তবে পুরো বক্তব্যে একই রূপ বজায় রাখুন। একটি রচনার শুরু থেকে শেষ পর্যন্ত tense-গুলোতে একই নিয়ম প্রয়োগ করুন।","pg":25,"q":true},{"n":134,"title":"Gender-এর বিভ্রান্তি:","dont":["The door is open, please shut her."],"say":["The door is open, please shut it."],"note":"ইংরেজিতে কেবল ব্যক্তি এবং প্রাণীর নামগুলোর gender (masculine বা feminine) রয়েছে। জড়বস্তুগুলো neuter gender এবং singular number-এ এরা pronoun হিসেবে it গ্রহণ করে।\nNote: তবে জড়বস্তুকে যখন ব্যক্তিরূপে কল্পনা করা হয়, তখন এরা masculine বা feminine pronoun গ্রহণ করে, যেমন: Time has his work to do; England is proud of her navy.","pg":26,"q":true},{"n":135,"title":"জড়বস্তুর জন্য possessive form ('s) ব্যবহার জনিত ভুল:","dont":["Her room's window is open."],"say":["The window of her room is open."],"note":"অপ্রাণীবাচক (inanimate) বস্তুর ক্ষেত্রে আমরা সাধারণত of structure ব্যবহার করি। তবে স্থান অথবা সংস্থার ক্ষেত্রে আমরা 's ব্যবহার করতে পারি: London's streets = The streets of London; Italy's climate = The climate of Italy; The school's main office = The main office of the school.\nNote: বিশেষত সময়ের পরিমাপের ক্ষেত্রে আমরা বলি: a day's work, a night's rest, a week's holiday, a pound's worth ইত্যাদি।","pg":26,"q":true},{"n":137,"title":"Than conjunction-এর পরে objective case ব্যবহার জনিত ভুল:","dont":["My sister is taller than me."],"say":["My sister is taller than I (am)."],"note":"Than হল একটি conjunction এবং এর পরে pronoun-এর nominative case বসে। Pronoun-এর পরের verb-টি সাধারণত উহ্য থাকে।\nNote: কথ্য ইংরেজিতে (spoken English) objective case প্রায়ই ব্যবহৃত হয়, যেমন: You're much taller than me.","pg":26,"q":true},{"n":138,"title":"Between-এর পরে nominative case ব্যবহার জনিত ভুল:","dont":["It's a secret between you and I."],"say":["It's a secret between you and me."],"note":"Between হল একটি preposition এবং সব preposition-এর নিজেদের পরে objective case গ্রহণ করে।","pg":27,"q":true},{"n":139,"title":"Gerund-এর পূর্বে objective case ব্যবহার জনিত ভুল:","dont":["Him laughing at her was what made her angry."],"say":["His laughing at her was what made her angry."],"note":"যখন কোনো verb-এর শেষে -ing যুক্ত হয়ে তা gerund হিসেবে ব্যবহৃত হয়, তখন এর পূর্বে কোনো noun বা pronoun বসলে তা অবশ্যই possessive case-এ হবে।","pg":27,"q":true},{"n":140,"title":"Double possessive/genitive-এর সাথে objective case ব্যবহার জনিত ভুল:","dont":["A friend of him told us the news."],"say":["A friend of his told us the news."],"note":"Note: অধিকৃত বস্তুর চেয়ে অধিকারী ব্যক্তির উপর আমরা যখন জোর প্রদান করতে চাই তখন প্রায়ই double possessive (of + name + ’s, his, mine ইত্যাদি) ব্যবহৃত হয়, যেমন: A friend of his একে আরও সহজভাবে বলা যায় one of his friends.","pg":27,"q":true},{"n":141,"title":"‘Self’ pronoun-গুলোর অশুদ্ধ ব্যবহার:","dont":["Michael and myself are here."],"say":["Michael and I are here."],"note":"জোর প্রদানের প্রয়োজন না থাকলে সাধারণ personal pronoun (I, you, he ইত্যাদি) ব্যবহৃত হবে।\nNote: Self যুক্ত pronoun দু’ভাবে ব্যবহৃত হয়: ১) জোর প্রদানের জন্য, যেমন: She herself was hurt; ২) আত্মবাচক (reflexive) হিসেবে, যেমন: She hurt herself.","pg":27,"q":true},{"n":142,"title":"Himself বা themselves-এর পরিবর্তে hisself বা theirselves ব্যবহার জনিত ভুল:","dont":["They fell down and hurt theirselves."],"say":["They fell down and hurt themselves."],"note":"Note: Reflexive pronoun-এর third person রূপ হল himself এবং themselves; hisself এবং theirselves শুদ্ধ নয়।","pg":27,"q":true},{"n":143,"title":"একই ধ্বনি বা উচ্চারণ বিশিষ্ট noun ও verb-এর ভুল ব্যবহার:","dont":["Becky played a good play of chess."],"say":["Becky played a good game of chess."],"note":"Note: কিছু verb এবং noun-এর রূপ ও অর্থ একই রকম, যেমন: The police fight a hard fight; Heather dreams long vivid dreams; If you lie the lie will catch you out! তবে আমরা সাধারণত একই শব্দ পাশাপাশি ব্যবহার এড়িয়ে চলি, যেমন: She fought a long battle with them; If you lie you will be caught out.","pg":27,"q":true},{"n":145,"title":"Everything-এর পরে what বা which ব্যবহার জনিত ভুল:","dont":["I heard everything which (or what) he said."],"say":["I heard everything (that) he said."],"note":"Note: All, some, any, something, everything, anything, much, little এবং nothing — এই শব্দগুলোর পরে relative pronoun which বা what ব্যবহৃত হতে পারে না। এদের পরে কেবল relative pronoun that ব্যবহৃত হতে পারে, তবে এটি সাধারণত উহ্য (omitted) থাকে।","pg":28,"q":true},{"n":146,"title":"Who এবং whom.","dont":["I saw the woman whom you said lived next door."],"say":["I saw the woman (who) you said lived next door."],"note":"আধুনিক ইংরেজিতে whom কদাচিৎ ব্যবহৃত হয়; সাধারণত to, by, with, after, on ইত্যাদি preposition-এর ঠিক পরে এটি ব্যবহার করি, যেমন: The girl to whom you were speaking is Nigerian. তবে বাক্যের ক্রম বদলে whom এড়িয়ে চলাই বেশি প্রচলিত: The girl you were speaking to is Nigerian. Who-এর পরিবর্তে that-ও ব্যবহার করা যায়: The girl that you were speaking to is Nigerian.","pg":28,"q":true},{"n":147,"title":"Superlative-এর পরে that-এর পরিবর্তে who, whom বা which ব্যবহার জনিত ভুল:","dont":["It's the best which I've seen."],"say":["It’s the best (that) I’ve seen."],"note":"Note: Superlative degree-এর পরে relative pronoun হিসেবে that ব্যবহৃত হয় (who, whom বা which নয়); বাস্তবে এটি প্রায়ই উহ্য (omitted) থাকে।","pg":28,"q":true},{"n":148,"title":"Same-এর পরে ভুল relative ব্যবহার জনিত ভুল:","dont":["Amelia bought the same bag that me."],"say":["Amelia bought the same bag as me."],"note":"Same এবং such-এর পরে relative হিসেবে as ব্যবহৃত হওয়া উচিত।\nNote: উল্লেখ্য, same-এর পরে মাঝে মাঝে that (who বা which নয়)-ও ব্যবহৃত হয়, যেমন: He wore the same clothes that he wore on Sunday.","pg":28,"q":true},{"n":149,"title":"Which?-এর পরিবর্তে who? বা what? ব্যবহার জনিত ভুল:","dont":["Who of the two boys is the taller?"],"say":["Which of the two boys is the taller?"],"note":"নির্দিষ্ট সংখ্যার মধ্যে কোনটি তা জিজ্ঞাসা করতে ব্যক্তি এবং বস্তু উভয়ের ক্ষেত্রে interrogative pronoun which ব্যবহৃত হয়।\nNote: What কোনো নির্দিষ্ট বিকল্প থেকে বাছাই ইঙ্গিত করে না, যেমন: What's your telephone number? এটি ব্যক্তির পেশা জানতেও ব্যবহৃত হয়, যেমন: What's your father? — He's a lawyer.","pg":29,"q":true},{"n":150,"title":"Who? এবং Whom?","dont":["Whom do you think will be chosen?","Who do you think I saw yesterday?"],"say":["Who do you think will be chosen?","Whom do you think I saw yesterday?"],"note":"a) প্রথম বাক্যে who হল will be chosen-এর subject; do you think কেবল একটি আনুষঙ্গিক অংশ।\nb) দ্বিতীয় বাক্যে whom হল saw-এর object; do you think কেবল একটি আনুষঙ্গিক অংশ।","pg":29,"q":true},{"n":151,"title":"Another-এর পরিবর্তে one other ব্যবহার জনিত ভুল:","dont":["Please give me one other book."],"say":["Please give me another book."],"note":"Note: An এবং other মিলে another গঠিত হয়েছে, তবে এটি an other হিসেবে না লিখে একটি word another হিসেবে লেখা হয়।","pg":29,"q":true},{"n":152,"title":"comparative-এর পরিবর্তে superlative ব্যবহার জনিত ভুল","dont":["John is the tallest of the two boys."],"say":["John is the taller of the two boys."],"note":"Note: যখন দু’জন ব্যক্তি বা দুটি বস্তুর মধ্যে তুলনা করা হয়, তখন comparative form অবশ্যই ব্যবহৃত হবে।","pg":29,"q":true},{"n":153,"title":"Comparative-এর পরে than-এর পরিবর্তে from ব্যবহার জনিত ভুল:","dont":["Amy is taller from her brother."],"say":["Amy is taller than her brother."],"note":"Note: Comparative degree-এর adjective (বা adverb)-এর পরে than বসে, from preposition নয়।","pg":29,"q":true},{"n":155,"title":"Most-এর পরিবর্তে the more ব্যবহার জনিত ভুল:","dont":["The more people will agree with me."],"say":["Most people will agree with me."],"note":"Note: ‘অধিকাংশ’ (the majority of) বোঝাতে অবশ্যই most ব্যবহৃত হবে, the more নয়।","pg":30,"q":true},{"n":157,"title":"At home-এর পরিবর্তে home ব্যবহার জনিত ভুল:","dont":["In the afternoon I stay home."],"say":["In the afternoon I stay at home."],"note":"Note: বাড়িতে (in the house) অর্থে at home phrase-টি ব্যবহৃত হওয়া উচিত। তবে come বা go-এর মতো গতি নির্দেশক verb-এর সাথে কোনো preposition-এর প্রয়োজন নেই, যেমন: He wants to go home.\nসতর্কতা: American English-এ “In the afternoon I stay home.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":30,"q":false},{"n":158,"title":"One of বা among-এর পরিবর্তে from ব্যবহার জনিত ভুল:","dont":["She is from the nicest girls I know."],"say":["She is one of the nicest girls I know."],"note":"Note: One of বা among-এর ভাব প্রকাশ করতে from ব্যবহার পরিহার করা উচিত।","pg":30,"q":true},{"n":160,"title":"Passive voice-এ intransitive verb ব্যবহার জনিত ভুল:","dont":["She was disappeared from the house."],"say":["She disappeared from the house."],"note":"Note: arise, appear, seem, become, consist এর মতো intransitive verb-গুলো passive voice-এ ব্যবহৃত হয় না।","pg":31,"q":true},{"n":163,"title":"সম্পর্কহীন participle (The unrelated participle):","dont":["Being in a hurry, the door was left open."],"say":["Being in a hurry, he left the door open."],"note":"Participle phrase-এর সাথে যুক্তিসঙ্গত subject ব্যবহারে সতর্কতা অবলম্বন করতে হবে। প্রদত্ত বাক্যে being in a hurry-এর যুক্তিসঙ্গত subject হল he, the door নয়।","pg":31,"q":true},{"n":164,"title":"Isn't it?, Question phrase-এর অপব্যবহার জনিত ভুল:","dont":["He played well yesterday, isn’t it?"],"say":["He played well yesterday, didn't he?"],"note":"Note: Question tag-এ পূর্ববর্তী বিবৃতির অনুরূপ tense ও person এবং সঠিক auxiliary verb ব্যবহৃত হবে। ‘Isn’t it?’ কেবল তখন ব্যবহৃত হয়, যখন পূর্ববর্তী বিবৃতিতে it is থাকে, যেমন: ":["The cinema likes me very much."],"say":["I like the cinema very much."],"note":"Note: The cinema appeals to me — এটিও সঠিক, অর্থ ‘আমি সিনেমা খুব পছন্দ করি’।","pg":35,"q":true},{"n":181,"title":"Neither... nor-এর পরিবর্তে neither...or ব্যবহার জনিত ভুল:","dont":["Sara speaks neither English or French."],"say":["Sara speaks neither English nor French."],"note":"মনে রাখুন, neither-এর পরে অবশ্যই nor বসবে, or নয়। তবে either-এর পরে or বসে, যেমন: She speaks either English or French.","pg":35,"q":true},{"n":182,"title":"Negative sentence-এ neither-এর পরিবর্তে both ব্যবহার জনিত ভুল:","dont":["Both of them didn’t go to school today."],"say":["Neither of them went to school today."],"note":"মনে রাখুন, negative sentence-এ both-এর পরিবর্তে neither ব্যবহৃত হয়।","pg":35,"q":true},{"n":183,"title":"Either-এর পরিবর্তে negative sentence-এ also বা too ব্যবহার জনিত ভুল:","dont":["Joe hasn't come also (or too)."],"say":["Joe hasn't come either."],"note":"মনে রাখুন, negative sentence-এ also বা too-এর পরিবর্তে either ব্যবহৃত হয়।","pg":35,"q":true},{"n":184,"title":"Or-এর পরিবর্তে negative sentence-এ and ব্যবহার জনিত ভুল:","dont":["I don’t like red and orange. I want the blue one."],"say":["I don’t like red or orange. I want the blue one."],"note":"যদি কোনো sentence-এ একটি negative word ব্যবহৃত হয়, তবে and-এর পরিবর্তে অবশ্যই or ব্যবহৃত হবে।\nNote: Clause-গুলোর subject আলাদা হলে conjunction and ব্যবহৃত হয়, যেমন: He didn’t write to me and I was worried.","pg":35,"q":true},{"n":185,"title":"Before বা when-এর পরিবর্তে till ব্যবহার জনিত ভুল:","dont":["I'd reached the school till the rain started."],"say":["I'd reached the school before the rain started."],"note":"Principal clause-এর কাজটি যদি সময় প্রকাশক clause-এর কাজের আগেই সম্পন্ন হয়, তবে সময় প্রকাশক clause-টি till-এর পরিবর্তে before বা when দিয়ে শুরু হয়।","pg":35,"q":true},{"n":186,"title":"Take an exam, give an exam নয়।","dont":["The pupil gave his exam."],"say":["The pupil took his exam."],"note":"Note: শিক্ষকগণ পরীক্ষা নেন / দেন (give বা set); শিক্ষার্থীরা পরীক্ষা দেয় (take বা sit for)।","pg":36,"q":true},{"n":187,"title":"To be right or wrong, to have right or wrong নয়।","dont":["You have right.","You have wrong."],"say":["You're right.","You're wrong."],"note":"","pg":36,"q":true},{"n":188,"title":"To be busy, to have work নয়।","dont":["I have much work this morning."],"say":["I'm very busy this morning."],"note":"Note: উল্লেখ্য, আমরা বলি: I have a lot of work to do this morning.","pg":36,"q":true},{"n":189,"title":"It’s cold ইত্যাদি, it has cold ইত্যাদি নয়।","dont":["It had cold this winter."],"say":["It was cold this winter."],"note":"","pg":36,"q":true},{"n":190,"title":"Go for a walk, make a walk নয়।","dont":["We made a walk along the river."],"say":["We went for a walk along the river."],"note":"Note: আমরা আরও বলতে পারি: we had a walk অথবা we took a walk along the river.","pg":36,"q":true},{"n":191,"title":"Go for a ride on a bicycle ইত্যাদি, go for a walk on a bicycle ইত্যাদি নয়।","dont":["We went for a walk on our bicycles."],"say":["We went for a ride on our bicycles."],"note":"Note: আমরা সাইকেলের উপরে, ঘোড়ার পিঠে ইত্যাদিতে আরোহণ করি (ride on), কিন্তু বাসে, ট্রেনে ইত্যাদি গণপরিবহনে চড়ি (ride in)।","pg":36,"q":true},{"n":192,"title":"Mount or get on a horse ইত্যাদি, ride a horse ইত্যাদি নয়।","dont":["Peter rode his horse and went home."],"say":["Peter got on his horse and rode home."],"note":"Note: To ride একটি চলমান কাজ নির্দেশ করে; To mount বা to get on একটি সাধারণ কাজ নির্দেশ করে।","pg":37,"q":true},{"n":193,"title":"Dismount বা get off a horse ইত্যাদি, come down from a horse ইত্যাদি নয়।","dont":["They came down from their horses."],"say":["They got off their horses."],"note":"Note: আমরা মোটরগাড়ি, ঘোড়ার গাড়ি ইত্যাদি থেকে নামি (alight from বা get out of), কিন্তু ট্রেন, বাস, ট্রাম ইত্যাদিতে get on বা get off করি।","pg":37,"q":true},{"n":194,"title":"Go on foot, go with the feet নয়।","dont":["Shall we go there with the feet?"],"say":["Shall we go there on foot?"],"note":"","pg":37,"q":true},{"n":195,"title":"Take or have a shower, make a shower নয়।","dont":["I make a shower every morning."],"say":["I take a shower every morning."],"note":"Or: I have a shower every morning.\nNote: সমুদ্রে বা নদীতে গোসলের কথা বললে আমরা বলি: to bathe, to have a bathe, to go for a bathe, to go bathing, to go for a swim বা to go swimming.","pg":37,"q":true},{"n":196,"title":"Ask a question, make a question নয়।","dont":["Naomi made me several questions."],"say":["Naomi asked me several questions."],"note":"","pg":37,"q":true},{"n":198,"title":"Give a discount, make a discount নয়।","dont":["He made me a small discount."],"say":["He gave me a small discount."],"note":"","pg":37,"q":true},{"n":199,"title":"Take exercise, make exercise নয়।","dont":["You ought to make more exercise."],"say":["You ought to take more exercise."],"note":"","pg":37,"q":true},{"n":200,"title":"Say one’s prayers, make or do one's prayer নয়।","dont":["I make my prayer before I go to bed."],"say":["I say my prayers before I go to bed."],"note":"Note: To say grace হল খাওয়া শুরু করার আগে (বা পরে) সৃষ্টিকর্তার কাছে কৃতজ্ঞতা জানিয়ে প্রার্থনা করা।","pg":37,"q":true},{"n":201,"title":"Give or deliver a lecture, make a lecture নয়।","dont":["He made an interesting lecture."],"say":["He gave an interesting lecture."],"note":"Or: He delivered an interesting lecture. Note: লক্ষণীয় আমরা বলি, He made an interesting speech.","pg":38,"q":true},{"n":202,"title":"Pretend, make oneself that নয়।","dont":["She makes herself that she knows."],"say":["She pretends to know."],"note":"","pg":38,"q":true},{"n":203,"title":"Have a dream, see a dream নয়।","dont":["I saw a strange dream last night."],"say":["I had a strange dream last night."],"note":"Or: I dreamt a strange dream last night.","pg":38,"q":true},{"n":204,"title":"Smoke a cigarette ইত্যাদি, drink a cigarette ইত্যাদি নয়।","dont":["He drinks too many cigarettes."],"say":["He smokes too many cigarettes."],"note":"","pg":38,"q":true},{"n":205,"title":"Make a mistake, do a mistake নয়।","dont":["I did one mistake in dictation."],"say":["I made one mistake in dictation."],"note":"","pg":38,"q":true},{"n":206,"title":"Tell or speak the truth, say the truth নয়।","dont":["Fiona always says the truth."],"say":["Fiona always tells the truth."],"note":"Or: Fiona always speaks the truth.\nNote: একইভাবে to tell a lie (to say a lie নয়), যেমন: He told me a lie.","pg":38,"q":true},{"n":207,"title":"See or watch a game, to follow a game নয়।","dont":["Did you follow the game?"],"say":["Did you see (or watch) the game?"],"note":"Note: To attend the class অর্থে to follow the lesson বলাও পরিহার করতে হবে।\nসতর্কতা: “Did you follow the game?” বাক্যটি ব্যাকরণগতভাবে শুদ্ধ, তবে এখানে বোঝানো অর্থে ঠিক নয়। প্রসঙ্গ ছাড়া প্রশ্নে এটি বিভ্রান্তিকর, তাই Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":38,"q":false},{"n":208,"title":"Turn (switch) the light on or off, open or shut the light নয়।","dont":["Please open (or shut) the light."],"say":["Please turn on (or off) the light."],"note":"Or: Please switch on (or off) the light.\nNote: আমরা প্রদীপ (lamp), মোমবাতি (candle) বা আগুন (fire) জ্বালাই (light) বা নেভাই (put out)।","pg":38,"q":true},{"n":209,"title":"Give an example, bring an example নয়।","dont":["Can you bring a better example?"],"say":["Can you give a better example?"],"note":"","pg":39,"q":true},{"n":210,"title":"Give a mark, put a mark নয়।","dont":["The teacher put me a good mark."],"say":["The teacher gave me a good mark."],"note":"Note: To put a lesson, to put a goal, to put punishment — এগুলো বলাও পরিহার করুন এবং পরিবর্তে বলুন: to give a lesson, to score a goal, to give punishment.","pg":39,"q":true},{"n":211,"title":"Set a watch by, put a watch with নয়।","dont":["I put my watch with the radio news."],"say":["I set my watch by the radio news."],"note":"","pg":39,"q":true},{"n":212,"title":"A watch is slow or fast, goes behind or in front নয়।","dont":["My watch goes two minutes behind."],"say":["My watch is two minutes slow."],"note":"Note: আমরা এও বলতে পারি, My watch loses or gains.","pg":39,"q":true},{"n":213,"title":"Show a film, play a film নয়।","dont":["This film will be played shortly."],"say":["This film will be shown shortly."],"note":"","pg":39,"q":true},{"n":215,"title":"Learn by heart, learn from out নয়।","dont":["We have a poem to learn from out."],"say":["We have a poem to learn by heart."],"note":"","pg":39,"q":true},{"n":217,"title":"It works miracles, it makes miracles নয়।","dont":["That medicine makes miracles."],"say":["That medicine works miracles."],"note":"","pg":40,"q":true},{"n":218,"title":"Getting on with, going with নয়।","dont":["How is Susan going with her work?"],"say":["How is Susan getting on with her work?"],"note":"","pg":40,"q":true},{"n":219,"title":"This morning ইত্যাদি, today morning ইত্যাদি নয়।","dont":["I haven't seen him today morning."],"say":["I haven't seen him this morning."],"note":"Note: Today morning, today afternoon, today evening, yesterday night, this night ইত্যাদি বলাও পরিহার করতে হবে এবং পরিবর্তে বলতে হবে, this morning, this afternoon, this evening, last night, tonight ইত্যাদি","pg":40,"q":true},{"n":220,"title":"Very slowly ইত্যাদি, slowly slowly ইত্যাদি নয়।","dont":["The boy came in slowly, slowly."],"say":["The boy came in very slowly."],"note":"একই adverb পরপর দুবার বলে জোর দেওয়া ইংরেজি রীতি নয়; জোর দিতে very ব্যবহার করুন।","pg":40,"q":true},{"n":221,"title":"What's the matter?, What have you? নয়।","dont":["What have you today?"],"say":["What's the matter with you today?"],"note":"Note: What's wrong (with you)? এবং What's the trouble (with you)? — এই দুটিও শুদ্ধ।","pg":40,"q":true},{"n":222,"title":"What do you call...? How do you call...? নয়।","dont":["How do you call this in English?"],"say":["What do you call this in English?"],"note":"Note: প্রশ্নটি কোনো নাম সম্বন্ধে না হয়ে কোনো অভিব্যক্তি সম্বন্ধে হলে বলা উচিত: How do you say this in English?","pg":40,"q":true},{"n":223,"title":"Ask for a thing, ask a thing নয়।","dont":["She came and asked my book."],"say":["She came and asked for my book."],"note":"","pg":41,"q":true},{"n":224,"title":"Dispose / get rid of a thing, dispose / get rid a thing নয়।","dont":["He'll dispose / get rid all his property."],"say":["He'll dispose / get rid of all his property."],"note":"","pg":41,"q":true},{"n":225,"title":"Dream of a thing, dream a thing নয়।","dont":["Young men dream glory and riches."],"say":["Young men dream of glory and riches."],"note":"","pg":41,"q":true},{"n":226,"title":"Explain to a person, explain a person নয়।","dont":["She explained me the matter."],"say":["She explained the matter to me."],"note":"","pg":41,"q":true},{"n":227,"title":"Knock at the door, Knock the door নয়।","dont":["Who is knocking the door?"],"say":["Who is knocking at the door?"],"note":"","pg":41,"q":true},{"n":228,"title":"Listen to a person or thing, listen a person or thing নয়।","dont":["They were listening the music."],"say":["They were listening to the music."],"note":"","pg":41,"q":true},{"n":229,"title":"Pay for a thing, pay a thing নয়।","dont":["How much did you pay the book?"],"say":["How much did you pay for the book?"],"note":"Note: একজন ব্যক্তি অন্য একজন ব্যক্তিকে টাকা দিতে (to pay a person) পারেন; তিনি একটি বিল, হিসাব বা চাঁদাও পরিশোধ (pay a bill) করতে পারেন। কিন্তু কোনো জিনিস কিনলে তার জন্য মূল্য পরিশোধ করতে হয়, সেক্ষেত্রে pay for বসে।","pg":41,"q":true},{"n":230,"title":"Point to or at a person or thing, point a person or thing নয়।","dont":["He pointed the map on the wall."],"say":["He pointed to the map on the wall."],"note":"Or: He pointed at the map on the wall.\nNote: Point out-ও ব্যবহৃত হয়, যেমন: He pointed out the boy who did it. Preposition ছাড়া to point অর্থ হল কোনো দিকে তাক করা, যেমন: Don't point the gun this way.","pg":42,"q":true},{"n":231,"title":"Remind a person of something, remind a person something নয়।","dont":["Please remind me that later."],"say":["Please remind me of that later."],"note":"","pg":42,"q":true},{"n":232,"title":"Reply to a person, reply a person নয়।","dont":["She's not replied me yet."],"say":["She’s not replied to me yet."],"note":"","pg":42,"q":true},{"n":233,"title":"Say to a person, say a person নয়।","dont":["Kevin said me, ‘Come tomorrow.’"],"say":["Kevin said to me, ‘Come tomorrow.’"],"note":"","pg":42,"q":true},{"n":234,"title":"Search for a lost thing, search a lost thing নয়।","dont":["They're searching the ball."],"say":["They're searching for the ball."],"note":"Note: In search of (কোনো কিছুর খোঁজে), যেমন: The wolf goes in search of sheep. For ছাড়া to search অর্থ হল কারো পকেট বা বাড়ি তল্লাশি করা, যেমন: The policeman searched the man and his house.","pg":42,"q":true},{"n":235,"title":"Share with a person, share a person নয়।","dont":["My friend shared me his book."],"say":["My friend shared his book with me."],"note":"","pg":42,"q":true},{"n":236,"title":"Speak to a person, speak a person নয়।","dont":["I'll speak him about that."],"say":["I'll speak to him about that."],"note":"Note: I'll speak to him অর্থ হল- মূলত আমিই কথা বলব (I'll do all the speaking); অন্যদিকে I'll speak with him অর্থ হল- তার সাথে আমার আলাপ হবে (I'll have a conversation with him)।","pg":42,"q":true},{"n":237,"title":"Supply a person with something, supply a person something নয়।","dont":["Can you supply me all I need?"],"say":["Can you supply me with all I need?"],"note":"Note: Provide a person with (কোন ব্যক্তিকে কিছু সরবরাহ করা) এটিও ব্যবহার করা যায়, যেমন: Can you provide me with all I need?","pg":42,"q":true},{"n":238,"title":"Think of a person or thing, think a person or thing নয়।","dont":["Think a number and then double it."],"say":["Think of a number and then double it."],"note":"","pg":44,"q":true},{"n":239,"title":"Wait for a person or thing, wait a person or thing নয়।","dont":["I'll wait you at the cinema."],"say":["I'll wait for you at the cinema."],"note":"Note: Await কোন preposition গ্রহণ করে না, যেমন: I'm awaiting your reply.","pg":44,"q":true},{"n":240,"title":"Wish for a thing, wish a thing নয়।","dont":["He doesn’t wish any reward."],"say":["He doesn’t wish for any reward."],"note":"","pg":44,"q":true},{"n":241,"title":"Write to a person, write a person নয়।","dont":["I'll write her tomorrow."],"say":["I'll write to her tomorrow."],"note":"Note: Write verb-এর direct object (বস্তুবাচক কর্ম) প্রকাশিত থাকলে preposition to উহ্য থাকতে পারে, যেমন: I'll write him a letter.\nসতর্কতা: American English-এ “I'll write her tomorrow.” বাক্যটিও শুদ্ধ হিসেবে ব্যবহৃত হয়; এখানের নিয়মটি প্রথাগত (traditional) ব্যাকরণ অনুযায়ী। তাই এটি Practice / Exam-এর প্রশ্নে রাখা হয়নি।","pg":44,"q":false},{"n":242,"title":"Third person singular-এর -s বা -es উহ্য (omitted) রাখা জনিত ভুল:","dont":["He speak English very well."],"say":["He speaks English very well."],"note":"Subject যখন he, she, it বা singular noun হয়, তখন present tense-এর verb থেকে -s বা -es যেন বাদ না পড়ে সেদিকে সতর্ক থাকতে হবে।","pg":44,"q":true},{"n":243,"title":"Doesn't-এর পরিবর্তে don't ব্যবহার জনিত ভুল:","dont":["He don't care what he says."],"say":["He doesn't care what he says."],"note":"Don't (= do not) I, we, you, they এবং plural noun-এর সাথে ব্যবহৃত হয়; পক্ষান্তরে doesn't (= does not) he, she, it এবং third person singular noun-এর সাথে ব্যবহৃত হয়।","pg":44,"q":true},{"n":244,"title":"Past tense-এর -d বা -ed উহ্য (omitted) রাখা জনিত ভুল:","dont":["I receive a letter yesterday."],"say":["I received a letter yesterday."],"note":"Regular verb-এর past tense থেকে -d বা -ed যাতে বাদ না যায় সে বিষয়ে সতর্ক থাকতে হবে; বলার সময়ও past tense-এর শেষাংশটুকু পরিষ্কারভাবে উচ্চারণ করা উচিত।","pg":45,"q":true},{"n":245,"title":"Plural form-এর -s বা -es বা -ies উহ্য (omitted) রাখা জনিত ভুল:","dont":["I paid six pound for the book."],"say":["I paid six pounds for the book."],"note":"Plural number-এর -s, -es বা -ies যেন বাদ না যায় সে দিকে অবশ্যই সতর্কতা অবলম্বন করতে হবে।\nNote: কিছু noun-এর irregular plural রূপ রয়েছে: man, men; woman, women; child, children; ox, oxen; foot, feet; tooth, teeth; goose, geese; mouse, mice.","pg":45,"q":true},{"n":246,"title":"Possessive-এর শেষাংশ উহ্য (omitted) রাখা জনিত ভুল:","dont":["A hen’s egg is different from a pigeon."],"say":["A hen’s egg is different from a pigeon’s."],"note":"তুলনায় প্রথম noun possessive case-এ থাকলে দ্বিতীয় noun-টিও অবশ্যই possessive case-এ হবে, যেমন: My mother's nose is bigger than my father's.","pg":45,"q":true},{"n":248,"title":"To be-এর পরে a বা an উহ্য (omitted) রাখা জনিত ভুল:","dont":["I'm not teacher; I'm student."],"say":["I'm not a teacher; I'm a student."],"note":"To be-এর পরে singular noun (complement) থাকলে তার পূর্বে indefinite article a বা an অবশ্যই ব্যবহৃত হবে।","pg":45,"q":true},{"n":249,"title":"Half-এর পরে a বা an উহ্য (omitted) রাখা জনিত ভুল:","dont":["He drank half glass of milk."],"say":["He drank half a glass of milk."],"note":"Note: Half a glass (an hour, a day, a mile ইত্যাদি) হল half of a glass (of an hour, of a day, of a mile ইত্যাদি)-এর সংক্ষিপ্ত রূপ।","pg":45,"q":true},{"n":250,"title":"Hundred ইত্যাদির পূর্বে a বা an উহ্য (omitted) রাখা জনিত ভুল:","dont":["Hundred years make a century."],"say":["A hundred years make a century."],"note":"Or: One hundred years make a century. Hundred এবং thousand-এর পূর্বে indefinite article: a বা numeral: one অবশ্যই ব্যবহৃত হবে।","pg":46,"q":true},{"n":251,"title":"Make a noise ইত্যাদি হতে a বা an-এর উহ্যতা (omission) রাখা জনিত ভুল:","dont":["I told them not to make noise."],"say":["I told them not to make a noise."],"note":"Note: একইভাবে: to make a mistake, to make a fortune, to make a will, to make an impression, to make an experiment, to make an attempt — এগুলো সঠিক গঠন।","pg":46,"q":true},{"n":255,"title":"Passive (voice) থেকে to be verb-এর উহ্যতা (omission) জনিত ভুল:","dont":["Charles Dickens born in 1812."],"say":["Charles Dickens was born in 1812."],"note":"Passive voice সর্বদা to be verb এবং মূল verb-এর past participle মিলে গঠিত হয় (to be + past participle)।","pg":46,"q":true},{"n":257,"titl "],"say":["I asked her for some paper, but she had none / didn’t have any."],"note":"সাধারণত, প্রতিটি transitive verb-এর একটি প্রকাশিত object থাকে, এখানে, none (not any-এর সমার্থক) হল verb-এর object.","pg":50,"q":true},{"n":271,"title":"দুটি object গ্রহণকারী verb-এর direct object উহ্য (omitted) রাখা জনিত ভুল:","dont":["I asked him for some ink, and he gave me."],"say":["I asked him for some ink, and he gave me some."],"note":"Give, bring, send, tell, buy, show ইত্যাদি কিছু transitive verb-এর দুটি object থাকে: একটি direct এবং অন্যটি indirect। এখানে some হল gave verb-টির direct object।","pg":51,"q":true},{"n":272,"title":"‘Enjoy’ verb-এর object-এর উহ্যতা (omission) জনিত ভুল:","dont":["I enjoyed during the holidays."],"say":["I enjoyed myself during the holidays."],"note":"Or: I enjoyed my holidays.\nEnjoy verb-এর পরে preposition বসতে পারে না, এর পরে সবসময় অবশ্যই একটি object বসবে; এই object হতে পারে একটি reflexive pronoun বা একটি noun।\nNote: আমরা বলে থাকি I had a good time (= I enjoyed myself); তবে I enjoyed my time বলা হয় না।","pg":51,"q":true},{"n":273,"title":"Adjective-এর পরে noun-এর উহ্যতা (omitted) জনিত ভুল:","dont":["The unfortunate was shot dead."],"say":["The unfortunate man was shot dead."],"note":"Adjective-এর পরের noun ছাড়া বাক্যের বক্তব্য বোঝা যায় না, তাই noun-টি অবশ্যই প্রকাশিত হবে।\nNote: কোনো adjective যখন plural noun হিসেবে ব্যবহৃত হয়, কেবল তখনই এর পরের noun উহ্য থাকে, যেমন: The poor envy the rich.","pg":51,"q":true},{"n":274,"title":"Number-এর মধ্যে ‘and’ word-এর উহ্যতা (omission) জনিত ভুল:","dont":["Eight thousand thirty-seven."],"say":["Eight thousand and thirty-seven."],"note":"Hundred, thousand, million ইত্যাদির সাথে একক ও দশকের সংখ্যাগুলো যুক্ত করতে conjunction and ব্যবহৃত হয় (British English)।","pg":51,"q":true},{"n":276,"title":"বয়স প্রকাশে ‘old’ word উহ্য (omitted) রাখা জনিত ভুল:","dont":["My sister is fifteen years."],"say":["My sister is fifteen years old."],"note":"Note: আমরা আরো বলতে পারি, My sister is fifteen years of age. অথবা সা
